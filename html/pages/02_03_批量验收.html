<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量验收</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body[data-active-page="02_03_批量验收.html"] #batch-acceptance-remark-tooltip {
      position: fixed;
      z-index: 60;
      max-width: 320px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="批量验收"
  data-active-page="02_03_批量验收.html">

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden flex flex-col h-full overflow-hidden">
    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4 shrink-0">
      <form id="batch-acceptance-search-form">
        <div class="grid grid-cols-4 gap-4 items-center">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">验收单号</label>
            <input type="text" name="acceptanceId" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">验收单名称</label>
            <input type="text" name="acceptanceName" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">资源类型</label>
            <select name="resourceType"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option value="">全部</option>
              <option value="纸质书">纸质书</option>
              <option value="视听资料">视听资料</option>
            </select>
          </div>
          <div class="flex items-center gap-2 justify-end">
            <button type="button" id="batch-acceptance-search-expand"
              class="flex items-center gap-1 text-sm text-sky-600 hover:text-sky-700 mr-2">
              展开
              <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <button type="submit"
              class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">检索</button>
            <button type="button" onclick="Common.resetForm('batch-acceptance-search-form')"
              class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
          </div>
        </div>
        <div id="batch-acceptance-search-extra" class="hidden grid grid-cols-4 gap-4 mt-3">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">验收状态</label>
            <select name="acceptanceStatus"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
              <option value="">全部</option>
              <option value="notStarted">未开始</option>
              <option value="inProgress">进行中</option>
              <option value="finished">已结束</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">供应商</label>
            <select name="supplier"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
              <option value="">全部</option>
              <option value="新纪元资源商">新纪元资源商</option>
              <option value="湖北三新">湖北三新</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">创建人</label>
            <input type="text" name="creator" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4 shrink-0">
      <button type="button" data-modal-open="batch-acceptance-add-modal"
        class="px-4 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">新增验收单</button>
      <button type="button" id="batch-settlement-btn"
        class="px-4 py-1.5 text-sm rounded bg-amber-500 text-white hover:bg-amber-600">申请结算</button>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden" data-list-selection-root="batch-acceptance-list">
      <div class="flex-1 overflow-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
            <tr>
              <th class="px-3 py-2.5 text-left w-10">
                <input type="checkbox" id="batch-select-all" class="rounded">
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">验收单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">验收单名称</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">资源类型</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">订单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">采选方式</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">供应商</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">发货单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">验收状态</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">收货册数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">验收备注</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">创建时间</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">创建人</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">结算状态</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap sticky right-0 bg-gray-50">操作</th>
            </tr>
          </thead>
          <tbody id="batch-acceptance-table-body" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200 shrink-0 bg-white">
        <span id="batch-acceptance-total" class="text-sm text-gray-500" data-list-selection-total
          data-list-selection-root="batch-acceptance-list" data-list-selection-checkbox=".batch-row-checkbox"
          data-list-selection-unit="个项目">总共 3 个项目</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option selected>10 条/页</option>
            <option>20 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增验收单弹窗 -->
  <div id="batch-acceptance-add-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl flex flex-col max-h-[90vh]"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">新增验收单</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="batch-acceptance-add-form" class="px-6 py-5 space-y-4 overflow-y-auto">
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">
            <span class="text-red-500">*</span> 验收单名称
          </label>
          <div class="flex-1">
            <input type="text" name="name" placeholder="请输入验收单名称" autocomplete="off"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">
            <span class="text-red-500">*</span> 资源类型
          </label>
          <div class="flex-1">
            <select name="resourceType"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
              <option value="">请选择资源类型</option>
              <option value="纸质书">纸质书</option>
              <option value="视听资料">视听资料</option>
            </select>
          </div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">
            <span class="text-red-500">*</span> 采选方式

          <div class="flex-1">
            <select name="method"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
              <option value="">请选择采选方式</option>
              <option value="征订目录">征订目录</option>
              <option value="现采">现采</option>
              <option value="交存">交存</option>
              <option value="捐赠">捐赠</option>
              <option value="拍卖">拍卖</option>
              <option value="交换">交换</option>
            </select>
          </div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">
            <span class="text-red-500">*</span> 供应商
          </label>
          <div class="flex-1">
            <select name="supplier"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
              <option value="">请选择供应商</option>
              <option value="北京市图书进出口有限公司">北京市图书进出口有限公司</option>
              <option value="湖北三新">湖北三新</option>
              <option value="新纪元资源商">新纪元资源商</option>
              <option value="湖南长沙">湖南长沙</option>
              <option value="教图">教图</option>
            </select>
          </div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">发货单号</label>
          <div class="flex-1">
            <input type="text" name="shipNo" placeholder="请输入发货单号" autocomplete="off"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">
            <span class="text-red-500">*</span> 订单号
          </label>
          <div class="flex-1">
            <input type="text" name="orderNo" placeholder="请输入订单号" autocomplete="off"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-36 text-right pt-2 shrink-0">验收备注</label>
          <div class="flex-1 relative">
            <textarea name="remark" rows="4" placeholder="请输入验收备注"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500 resize-none"></textarea>
            <span id="batch-acceptance-remark-count" class="absolute bottom-2 right-3 text-xs text-gray-400">0</span>
          </div>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="batch-acceptance-add-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">确定</button>
      </div>
    </div>
  </div>

  <!-- 申请结算确认弹窗 -->
  <div id="batch-settlement-confirm-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md" onclick="event.stopPropagation()">
      <div class="px-6 py-6 flex items-start gap-4">
        <div class="shrink-0 w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center">
          <svg class="w-6 h-6 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01M12 3a9 9 0 100 18 9 9 0 000-18z"/>
          </svg>
        </div>
        <p class="text-sm text-gray-800 pt-2.5">确定申请结算该验收单吗？</p>
      </div>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="batch-settlement-confirm"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">确定</button>
      </div>
    </div>
  </div>

  <div id="batch-acceptance-remark-tooltip" class="hidden" role="tooltip"></div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 批量验收示例数据 */
    const batchAcceptanceRows = [
      { no: 1, id: 'ysPG00120260529005', name: '20260529测试2', type: '视听资料', orderNo: 'PG001820260529004', method: '捐赠', supplier: '新纪元资源商', shipNo: '997765468', status: 'finished', receivedCount: 1, remark: true, remarkText: '捐赠入库，无需结算。', time: '2026-05-29 13:55:16', creator: '杨晓婉', settlement: 'notApplied', detailPage: '02_01_05_验收详情按种_视听资料.html' },
      { no: 2, id: 'ysPG00120260528003', name: '批量验收单', type: '视听资料', orderNo: 'PG001820260528003', method: '现采', supplier: '湖北三新', shipNo: 'SF9001', status: 'finished', receivedCount: 1, remark: true, remarkText: '批量导入完成，请核对收货数量。', time: '2026-05-28 10:20:30', creator: '王二小', settlement: 'settled', detailPage: '02_01_05_验收详情按种_视听资料.html' },
      { no: 3, id: 'ysPG00120260522008', name: 'PG001B20240522008', type: '纸质书', orderNo: 'PG001B20240522008', method: '现采', supplier: '湖北三新', shipNo: 'SF9002', status: 'finished', receivedCount: 3, remark: false, remarkText: '', time: '2026-05-22 09:15:42', creator: '赵付', settlement: 'settled', detailPage: '02_01_02_验收详情按种_纸质书.html' }
    ];

    /**
     * 渲染验收状态标签
     * @param {string} status - 状态标识
     * @returns {string}
     */
    function renderBatchAcceptanceStatus(status) {
      const map = {
        finished: '<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600 border border-gray-200">已结束</span>',
        notStarted: '<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-50 text-gray-500 border border-gray-200">未开始</span>',
        inProgress: '<span class="inline-block px-2 py-0.5 rounded text-xs bg-sky-50 text-sky-600 border border-sky-200">进行中</span>'
      };
      return map[status] || '';
    }

    /**
     * 渲染结算状态标签
     * @param {string} settlement - 结算状态标识
     * @returns {string}
     */
    function renderBatchSettlementStatus(settlement) {
      const map = {
        pending: '<span class="inline-block px-2 py-0.5 rounded text-xs bg-amber-50 text-amber-600 border border-amber-200">待结算</span>',
        settled: '<span class="inline-block px-2 py-0.5 rounded text-xs bg-emerald-50 text-emerald-600 border border-emerald-200">已结算</span>',
        notApplied: '<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-50 text-gray-500 border border-gray-200">未申请</span>'
      };
      return map[settlement] || '';
    }

    /**
     * 渲染操作列
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderBatchAcceptanceOps(row) {
      if (row.settlement === 'notApplied' && row.status === 'finished') {
        return `<a href="#" class="text-sky-600 hover:underline mr-3">重启验收</a>
                <a href="#" class="text-sky-600 hover:underline batch-row-settlement-btn" data-row-no="${row.no}">申请结算</a>`;
      }
      return '<span class="text-gray-400">—</span>';
    }

    /**
     * 渲染验收备注单元格
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderBatchAcceptanceRemarkCell(row) {
      const remark = (row.remarkText || '').trim();
      if (!remark) {
        return '<span class="text-gray-300 cursor-default select-none">查看</span>';
      }
      return `<span class="batch-acceptance-remark-trigger text-sky-600 hover:underline cursor-pointer"
        data-row-no="${row.no}">查看</span>`;
    }

    /** @type {HTMLElement|null} */
    let batchAcceptanceRemarkTooltip = null;

    /**
     * 定位验收备注浮层
     * @param {HTMLElement} trigger - 触发元素
     */
    function positionBatchAcceptanceRemarkTooltip(trigger) {
      if (!batchAcceptanceRemarkTooltip) return;

      const rect = trigger.getBoundingClientRect();
      const gap = 6;
      let top = rect.bottom + gap;
      let left = rect.left;

      batchAcceptanceRemarkTooltip.classList.remove('hidden');
      const tooltipRect = batchAcceptanceRemarkTooltip.getBoundingClientRect();

      if (left + tooltipRect.width > window.innerWidth - 8) {
        left = Math.max(8, window.innerWidth - tooltipRect.width - 8);
      }
      if (top + tooltipRect.height > window.innerHeight - 8) {
        top = Math.max(8, rect.top - tooltipRect.height - gap);
      }

      batchAcceptanceRemarkTooltip.style.top = `${top}px`;
      batchAcceptanceRemarkTooltip.style.left = `${left}px`;
    }

    /**
     * 隐藏验收备注浮层
     */
    function hideBatchAcceptanceRemarkTooltip() {
      batchAcceptanceRemarkTooltip?.classList.add('hidden');
    }

    /**
     * 绑定验收备注浮层交互
     */
    function initBatchAcceptanceRemarkTooltip() {
      batchAcceptanceRemarkTooltip = document.getElementById('batch-acceptance-remark-tooltip');
      const tbody = document.getElementById('batch-acceptance-table-body');
      if (!batchAcceptanceRemarkTooltip || !tbody) return;

      tbody.addEventListener('mouseover', event => {
        const trigger = event.target.closest('.batch-acceptance-remark-trigger');
        if (!trigger) return;

        const row = batchAcceptanceRows.find(item => item.no === Number(trigger.dataset.rowNo));
        const remark = (row?.remarkText || '').trim();
        if (!remark) return;

        batchAcceptanceRemarkTooltip.textContent = remark;
        positionBatchAcceptanceRemarkTooltip(trigger);
      });

      tbody.addEventListener('mouseout', event => {
        const trigger = event.target.closest('.batch-acceptance-remark-trigger');
        if (!trigger) return;

        const related = event.relatedTarget;
        if (related instanceof Node && trigger.contains(related)) return;
        hideBatchAcceptanceRemarkTooltip();
      });

      window.addEventListener('scroll', hideBatchAcceptanceRemarkTooltip, true);
    }

    /**
     * 渲染表格行
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderBatchAcceptanceRow(row) {
      const remarkCell = renderBatchAcceptanceRemarkCell(row);
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2">
            <input type="checkbox" class="rounded batch-row-checkbox" data-row-no="${row.no}">
          </td>
          <td class="px-3 py-2 text-gray-600">${row.no}</td>
          <td class="px-3 py-2 whitespace-nowrap">
            <a href="${row.detailPage}" class="text-sky-600 hover:underline">${row.id}</a>
          </td>
          <td class="px-3 py-2">${row.name}</td>
          <td class="px-3 py-2">${row.type}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.orderNo}</td>
          <td class="px-3 py-2">${row.method}</td>
          <td class="px-3 py-2">${row.supplier}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.shipNo}</td>
          <td class="px-3 py-2">${renderBatchAcceptanceStatus(row.status)}</td>
          <td class="px-3 py-2">${row.receivedCount}</td>
          <td class="px-3 py-2">${remarkCell}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.time}</td>
          <td class="px-3 py-2">${row.creator}</td>
          <td class="px-3 py-2">${renderBatchSettlementStatus(row.settlement)}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">${renderBatchAcceptanceOps(row)}</td>
        </tr>`;
    }

    /**
     * 重新渲染批量验收列表
     */
    function renderBatchAcceptanceTable() {
      const tbody = document.getElementById('batch-acceptance-table-body');
      if (tbody) tbody.innerHTML = batchAcceptanceRows.map(renderBatchAcceptanceRow).join('');
      ListSelectionSummary.refresh('batch-acceptance-total', {
        totalCount: batchAcceptanceRows.length,
        unit: '个项目'
      });
      syncBatchSelectAllState();
    }

    /**
     * 获取已勾选的批量验收行号列表
     * @returns {number[]}
     */
    function getCheckedBatchRowNos() {
      return Array.from(document.querySelectorAll('.batch-row-checkbox:checked'))
        .map(el => Number(el.dataset.rowNo))
        .filter(no => !Number.isNaN(no));
    }

    /**
     * 同步表头全选复选框状态
     */
    function syncBatchSelectAllState() {
      const selectAll = document.getElementById('batch-select-all');
      const rowChecks = document.querySelectorAll('.batch-row-checkbox');
      if (!selectAll || !rowChecks.length) return;
      const checkedCount = document.querySelectorAll('.batch-row-checkbox:checked').length;
      selectAll.checked = checkedCount > 0 && checkedCount === rowChecks.length;
      selectAll.indeterminate = checkedCount > 0 && checkedCount < rowChecks.length;
    }

    /**
     * 打开申请结算确认弹窗
     */
    function openBatchSettlementConfirmModal() {
      const modal = document.getElementById('batch-settlement-confirm-modal');
      if (modal) modal.classList.remove('hidden');
    }

    /**
     * 关闭申请结算确认弹窗
     */
    function closeBatchSettlementConfirmModal() {
      const modal = document.getElementById('batch-settlement-confirm-modal');
      if (modal) modal.classList.add('hidden');
    }

    /**
     * 重置新增验收单表单
     */
    function resetBatchAcceptanceAddForm() {
      const form = document.getElementById('batch-acceptance-add-form');
      if (!form) return;
      form.reset();
      const remarkCount = document.getElementById('batch-acceptance-remark-count');
      if (remarkCount) remarkCount.textContent = '0';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBatchAcceptanceTable();
      initBatchAcceptanceRemarkTooltip();

      const expandBtn = document.getElementById('batch-acceptance-search-expand');
      const extra = document.getElementById('batch-acceptance-search-extra');
      if (expandBtn && extra) {
        let expanded = false;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          extra.classList.toggle('hidden', !expanded);
          expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
          expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
        });
      }

      const tbody = document.getElementById('batch-acceptance-table-body');
      if (tbody) {
        tbody.addEventListener('change', e => {
          if (e.target.classList.contains('batch-row-checkbox')) {
            syncBatchSelectAllState();
          }
        });
        tbody.addEventListener('click', e => {
          const settlementBtn = e.target.closest('.batch-row-settlement-btn');
          if (!settlementBtn) return;
          e.preventDefault();
          openBatchSettlementConfirmModal();
        });
      }

      const selectAll = document.getElementById('batch-select-all');
      if (selectAll) {
        selectAll.addEventListener('change', () => {
          document.querySelectorAll('.batch-row-checkbox').forEach(cb => {
            cb.checked = selectAll.checked;
          });
          selectAll.indeterminate = false;
        });
      }

      document.getElementById('batch-settlement-btn')?.addEventListener('click', () => {
        if (!getCheckedBatchRowNos().length) {
          alert('请先勾选验收单');
          return;
        }
        openBatchSettlementConfirmModal();
      });
      document.getElementById('batch-settlement-confirm')?.addEventListener('click', closeBatchSettlementConfirmModal);

      document.querySelector('[data-modal-open="batch-acceptance-add-modal"]')
        ?.addEventListener('click', resetBatchAcceptanceAddForm);

      const batchRemarkArea = document.querySelector('#batch-acceptance-add-form textarea[name="remark"]');
      const batchRemarkCount = document.getElementById('batch-acceptance-remark-count');
      if (batchRemarkArea && batchRemarkCount) {
        batchRemarkArea.addEventListener('input', () => {
          batchRemarkCount.textContent = String(batchRemarkArea.value.length);
        });
      }

      const batchAddModal = document.getElementById('batch-acceptance-add-modal');
      document.getElementById('batch-acceptance-add-submit')?.addEventListener('click', () => {
        const form = document.getElementById('batch-acceptance-add-form');
        if (!form) return;
        if (!form.elements.name.value.trim()) {
          alert('请输入验收单名称');
          return;
        }
        if (!form.elements.resourceType.value) {
          alert('请选择资源类型');
          return;
        }
        if (!form.elements.method.value) {
          alert('请选择采选方式');
          return;
        }
        if (!form.elements.supplier.value) {
          alert('请选择供应商');
          return;
        }
        if (!form.elements.orderNo.value.trim()) {
          alert('请输入订单号');
          return;
        }
        if (batchAddModal) batchAddModal.classList.add('hidden');
        resetBatchAcceptanceAddForm();
      });
    });
  </script>
</body>
</html>
