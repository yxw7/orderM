<body class="h-screen flex flex-col overflow-hidden"

  <div id="main-content" class="hidden">

            收起

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>

            class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">查询</button>
          <button type="button" onclick="Common.resetForm('settlement-search-form')"
            class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
        </div>
        <div class="grid grid-cols-3 gap-4 pr-72">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">验收单号</label>
            <input type="text" placeholder="请输入"

          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">验收单名称</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">资源类型</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>纸质书</option>
              <option>视听资料</option>
            </select>
          </div>
        </div>
        <div id="settlement-search-extra" class="grid grid-cols-3 gap-4 mt-3 pr-72">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">供应商</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>北京万经</option>
              <option>北京人艺</option>
              <option>教图</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">发货单号</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">申请结算人</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option value="">请输入</option>
              <option>系统</option>
              <option>李佳</option>
            </select>
          </div>
          <div class="flex items-center gap-2 col-span-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">申请结算时间</label>
            <div class="flex flex-1 items-center gap-2 max-w-md">
              <input type="date"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <span class="text-gray-400 text-sm">~</span>
              <input type="date"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4">
      <button type="button" id="settlement-add-btn" disabled
        class="px-4 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400 disabled:bg-gray-50 disabled:cursor-not-allowed disabled:hover:bg-gray-50">新增结算</button>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200" data-list-selection-root="settlement-list">
      <div class="overflow-x-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2.5 text-left w-10">
                <input type="checkbox" id="settlement-select-all" class="rounded">
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">验收单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">供应商</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">发货单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[140px]">验收单名称</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">资源类型</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收种数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收套数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收册数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收总码洋(元)</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收总实洋(元)</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                <span class="inline-flex items-center gap-1">
                  申请结算时间
                  <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100" id="settlement-table-body"></tbody>

      </div>

      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
        <span id="settlement-list-total" class="text-sm text-gray-500" data-list-selection-total
          data-list-selection-root="settlement-list" data-list-selection-checkbox=".settlement-row-checkbox"

        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option>10 条/页</option>
            <option>20 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 新增结算弹窗 -->
  <div id="settlement-add-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-5xl flex flex-col max-h-[90vh]"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">新增结算</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="settlement-add-form" class="px-6 py-5 overflow-y-auto space-y-4">
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-28 text-right shrink-0">
            <span class="text-red-500">*</span> 结算单名称
          </label>
          <input type="text" name="settlementName" placeholder="请输入结算单名称" autocomplete="off"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex items-start gap-2 bg-sky-50 border border-sky-100 rounded px-4 py-3 text-sm text-sky-700">
          <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M12 3a9 9 0 100 18 9 9 0 000-18z"/>
          </svg>
          <span id="settlement-add-supplier-tip">本次将要结算的供应商是湖北三新，明细如下：</span>
        </div>
        <div id="settlement-add-details" class="space-y-3 text-sm text-gray-700"></div>
        <div id="settlement-add-totals"
          class="border-t border-gray-100 pt-3 text-sm text-gray-700"></div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-28 text-right pt-2 shrink-0">结算备注</label>
          <div class="flex-1 relative">
            <textarea name="remark" rows="4" maxlength="500" placeholder="请输入结算备注"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500 resize-none"></textarea>
            <span id="settlement-add-remark-count" class="absolute bottom-2 right-3 text-xs text-gray-400">0 / 500</span>
          </div>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="settlement-add-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">确定</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 待结算列表示例数据 */
    const settlementRows = [
      {
        no: 1,
        acceptId: 'ys00120260131004',
        supplier: '北京万经',
        deliveryId: '',
        acceptName: '视听资料20260131004',
        resourceType: '视听资料',
        species: 1,
        sets: 0,
        volumes: 12,
        listPrice: '0.00',
        netPrice: '0.00',
        applyTime: '2026-03-04 10:49:31',
        applicant: '系统'
      },
      {
        no: 2,
        acceptId: 'ys00120260131003',
        supplier: '北京人艺',
        deliveryId: '',
        acceptName: '纸质书20260131003',
        resourceType: '纸质书',
        species: 1,
        sets: 0,
        volumes: 0,
        listPrice: '0.00',
        netPrice: '0.00',
        applyTime: '2026-03-04 10:44:09',
        applicant: '系统'
      },
      {
        no: 3,
        acceptId: 'ysPG00120260522003',
        supplier: '湖北三新',
        deliveryId: '123123',
        acceptName: '20260522验收单',
        resourceType: '纸质书',
        species: 1,
        sets: 2,
        volumes: 4,
        listPrice: '600.00',
        netPrice: '480.00',
        applyTime: '2026-05-22 14:30:00',
        applicant: '李佳'
      },
      {
        no: 4,
        acceptId: 'ysPG00120260522004',
        supplier: '湖北三新',
        deliveryId: '123124',
        acceptName: '20260522验收单02',
        resourceType: '纸质书',
        species: 2,
        sets: 1,
        volumes: 2,
        listPrice: '300.00',
        netPrice: '240.00',
        applyTime: '2026-05-22 15:10:00',
        applicant: '李佳'
      }
    ];

    /** 合并结算勾选提示文案 */
    const SETTLEMENT_GROUP_MSG = '只能勾选相同供应商且相同资源类型的结算单';

    /**
     * 渲染待结算表格行
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderSettlementRow(row) {
      const delivery = row.deliveryId || '—';
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2">
            <input type="checkbox" class="rounded settlement-row-checkbox" data-row-no="${row.no}"
              data-supplier="${row.supplier}" data-resource-type="${row.resourceType}">
          </td>
          <td class="px-3 py-2 text-gray-600">${row.no}</td>
          <td class="px-3 py-2 whitespace-nowrap">
            <a href="02_01_02_验收详情按种_纸质书.html" class="text-sky-600 hover:underline">${row.acceptId}</a>
          </td>
          <td class="px-3 py-2">${row.supplier}</td>
          <td class="px-3 py-2 text-gray-500">${delivery}</td>
          <td class="px-3 py-2">${row.acceptName}</td>
          <td class="px-3 py-2">${row.resourceType}</td>
          <td class="px-3 py-2">${row.species}</td>
          <td class="px-3 py-2">${row.sets}</td>
          <td class="px-3 py-2">${row.volumes}</td>
          <td class="px-3 py-2">${row.listPrice}</td>
          <td class="px-3 py-2">${row.netPrice}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.applyTime}</td>
          <td class="px-3 py-2">${row.applicant}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">
            <a href="03_01_02_撤销申请结算.html" class="text-sky-600 hover:underline">撤销申请结算</a>
          </td>
        </tr>`;
    }

    /**
     * 获取已勾选的待结算行号列表
     * @returns {number[]}
     */
    function getCheckedSettlementRowNos() {
      return Array.from(document.querySelectorAll('.settlement-row-checkbox:checked'))
        .map(el => Number(el.dataset.rowNo))
        .filter(no => !Number.isNaN(no));
    }

    /**
     * 获取已勾选的待结算行数据
     * @returns {Object[]}
     */
    function getCheckedSettlementRows() {
      const nos = getCheckedSettlementRowNos();
      return settlementRows.filter(row => nos.includes(row.no));
    }

    /**
     * 获取当前已勾选结算单对应的合并分组
     * @returns {{ supplier: string, resourceType: string } | null}
     */
    function getActiveSettlementGroup() {
      const checked = document.querySelector('.settlement-row-checkbox:checked');
      if (!checked) return null;
      return {
        supplier: checked.dataset.supplier,
        resourceType: checked.dataset.resourceType
      };
    }

    /**
     * 判断复选框是否属于同一合并分组
     * @param {HTMLInputElement} checkbox - 复选框元素
     * @param {{ supplier: string, resourceType: string }} group - 合并分组
     * @returns {boolean}
     */
    function isSameSettlementGroup(checkbox, group) {
      return checkbox.dataset.supplier === group.supplier
        && checkbox.dataset.resourceType === group.resourceType;
    }

    /**
     * 根据已选供应商与资源类型限制可勾选的结算单
     */
    function applySettlementGroupConstraint() {
      const activeGroup = getActiveSettlementGroup();
      document.querySelectorAll('.settlement-row-checkbox').forEach(cb => {
        const mismatch = activeGroup && !isSameSettlementGroup(cb, activeGroup);
        cb.disabled = mismatch;
        cb.closest('tr')?.classList.toggle('opacity-50', mismatch);
      });
    }

    /**
     * 同步表头全选复选框状态
     */
    function syncSettlementSelectAllState() {
      const selectAll = document.getElementById('settlement-select-all');
      const activeGroup = getActiveSettlementGroup();
      const sameGroupChecks = activeGroup
        ? Array.from(document.querySelectorAll('.settlement-row-checkbox'))
          .filter(cb => isSameSettlementGroup(cb, activeGroup))
        : Array.from(document.querySelectorAll('.settlement-row-checkbox'));
      if (!selectAll || !sameGroupChecks.length) return;
      const checkedCount = sameGroupChecks.filter(cb => cb.checked).length;
      selectAll.checked = checkedCount > 0 && checkedCount === sameGroupChecks.length;
      selectAll.indeterminate = checkedCount > 0 && checkedCount < sameGroupChecks.length;
    }

    /**
     * 根据勾选状态更新新增结算按钮
     */
    function updateSettlementToolbarState() {
      const addBtn = document.getElementById('settlement-add-btn');
      if (addBtn) addBtn.disabled = getCheckedSettlementRowNos().length === 0;
    }

    /**
     * 处理结算单行复选框变更
     * @param {HTMLInputElement} checkbox - 复选框元素
     */
    function handleSettlementCheckboxChange(checkbox) {
      if (checkbox.checked) {
        const otherChecked = Array.from(document.querySelectorAll('.settlement-row-checkbox:checked'))
          .filter(cb => cb !== checkbox);
        if (otherChecked.length) {
          const ref = otherChecked[0];
          const sameGroup = ref.dataset.supplier === checkbox.dataset.supplier
            && ref.dataset.resourceType === checkbox.dataset.resourceType;
          if (!sameGroup) {
            checkbox.checked = false;
            alert(SETTLEMENT_GROUP_MSG);
            return;
          }
        }
      }
      applySettlementGroupConstraint();
      syncSettlementSelectAllState();
      updateSettlementToolbarState();
    }

    /**
     * 渲染结算明细字段（标签与值同一行）
     * @param {string} label - 字段标签
     * @param {string|number} value - 字段值
     * @param {string} [valueClass='text-gray-900'] - 值文本样式
     * @returns {string}
     */
    function renderSettlementDetailField(label, value, valueClass = 'text-gray-900') {
      return `<div class="flex items-center whitespace-nowrap text-sm">
        <span class="text-gray-500">${label}：</span>
        <span class="${valueClass}">${value}</span>
      </div>`;
    }

    /**
     * 渲染结算明细块
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderSettlementDetailBlock(row) {
      const delivery = row.deliveryId || '—';
      return `
        <div class="space-y-2">
          <div class="flex flex-wrap items-center gap-x-10 gap-y-2">
            ${renderSettlementDetailField('验收单号', row.acceptId)}
            ${renderSettlementDetailField('发货单号', delivery)}
            ${renderSettlementDetailField('实收种数', row.species)}
            ${renderSettlementDetailField('实收套数', row.sets)}
          </div>
          <div class="flex flex-wrap items-center gap-x-10 gap-y-2">
            ${renderSettlementDetailField('实收册数', row.volumes)}
            ${renderSettlementDetailField('实收总码洋(元)', row.listPrice)}
            ${renderSettlementDetailField('实收总实洋(元)', row.netPrice)}
          </div>
        </div>`;
    }

    /**
     * 汇总勾选行结算数据
     * @param {Object[]} rows - 行数据列表
     * @returns {{ species: number, sets: number, volumes: number, listPrice: string, netPrice: string }}
     */
    function calcSettlementTotals(rows) {
      const totals = rows.reduce((acc, row) => {
        acc.species += row.species || 0;
        acc.sets += row.sets || 0;
        acc.volumes += row.volumes || 0;
        acc.listPrice += Number(row.listPrice) || 0;
        acc.netPrice += Number(row.netPrice) || 0;
        return acc;
      }, { species: 0, sets: 0, volumes: 0, listPrice: 0, netPrice: 0 });
      return {
        species: totals.species,
        sets: totals.sets,
        volumes: totals.volumes,
        listPrice: totals.listPrice.toFixed(2),
        netPrice: totals.netPrice.toFixed(2)
      };
    }

    /**
     * 打开新增结算弹窗
     */
    function openSettlementAddModal() {
      const checkedRows = getCheckedSettlementRows();
      if (!checkedRows.length) {
        alert('请先勾选待结算数据');
        return;
      }
      const suppliers = [...new Set(checkedRows.map(row => row.supplier))];
      const resourceTypes = [...new Set(checkedRows.map(row => row.resourceType))];
      if (suppliers.length > 1 || resourceTypes.length > 1) {
        alert(SETTLEMENT_GROUP_MSG);
        return;
      }
      const form = document.getElementById('settlement-add-form');
      const modal = document.getElementById('settlement-add-modal');
      const supplierTip = document.getElementById('settlement-add-supplier-tip');
      const detailsEl = document.getElementById('settlement-add-details');
      const totalsEl = document.getElementById('settlement-add-totals');
      if (!form || !modal || !supplierTip || !detailsEl || !totalsEl) return;

      const supplier = checkedRows[0].supplier;
      const resourceType = checkedRows[0].resourceType;
      const totals = calcSettlementTotals(checkedRows);

      form.elements.settlementName.value = '';
      form.elements.remark.value = '';
      document.getElementById('settlement-add-remark-count').textContent = '0 / 500';
      supplierTip.textContent = `本次将要结算的供应商是${supplier}（${resourceType}），明细如下：`;
      detailsEl.innerHTML = checkedRows.map(renderSettlementDetailBlock).join('<div class="border-t border-gray-100 pt-3"></div>');
      totalsEl.innerHTML = `
        <div class="flex flex-wrap items-center gap-x-10 gap-y-2 w-full">
          <span class="text-gray-600 font-medium whitespace-nowrap">合计：</span>
          ${renderSettlementDetailField('实收总种数', totals.species, 'font-medium text-gray-900')}
          ${renderSettlementDetailField('实收总套数', totals.sets, 'font-medium text-gray-900')}
          ${renderSettlementDetailField('实收总册数', totals.volumes, 'font-medium text-gray-900')}
          ${renderSettlementDetailField('实收总码洋(元)', totals.listPrice, 'font-medium text-gray-900')}
          ${renderSettlementDetailField('实收总实洋(元)', totals.netPrice, 'font-medium text-gray-900')}
        </div>`;

      modal.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('settlement-table-body');
      if (tbody) {
        tbody.innerHTML = settlementRows.map(renderSettlementRow).join('');
        ListSelectionSummary.refresh('settlement-list-total', { totalCount: settlementRows.length });
        tbody.addEventListener('change', e => {
          if (e.target.classList.contains('settlement-row-checkbox')) {
            handleSettlementCheckboxChange(e.target);
          }
        });
      }

      const selectAll = document.getElementById('settlement-select-all');
      if (selectAll) {
        selectAll.addEventListener('change', () => {
          const firstCheckbox = document.querySelector('.settlement-row-checkbox');
          const activeGroup = getActiveSettlementGroup() || (firstCheckbox ? {
            supplier: firstCheckbox.dataset.supplier,
            resourceType: firstCheckbox.dataset.resourceType
          } : null);
          document.querySelectorAll('.settlement-row-checkbox').forEach(cb => {
            if (!activeGroup || isSameSettlementGroup(cb, activeGroup)) {
              cb.checked = selectAll.checked;
            }
          });
          if (selectAll.checked && !getActiveSettlementGroup()) {
            selectAll.checked = false;
            alert(SETTLEMENT_GROUP_MSG);
            return;
          }
          applySettlementGroupConstraint();
          selectAll.indeterminate = false;
          updateSettlementToolbarState();
        });
      }

      document.getElementById('settlement-add-btn')?.addEventListener('click', openSettlementAddModal);

      const remarkArea = document.querySelector('#settlement-add-form textarea[name="remark"]');
      const remarkCount = document.getElementById('settlement-add-remark-count');
      if (remarkArea && remarkCount) {
        remarkArea.addEventListener('input', () => {
          remarkCount.textContent = `${remarkArea.value.length} / 500`;
        });
      }

      const addModal = document.getElementById('settlement-add-modal');
      document.getElementById('settlement-add-submit')?.addEventListener('click', () => {
        const form = document.getElementById('settlement-add-form');
        if (!form) return;
        if (!form.elements.settlementName.value.trim()) {
          alert('请输入结算单名称');
          return;
        }
        if (addModal) addModal.classList.add('hidden');
      });

      const expandBtn = document.getElementById('settlement-search-expand');
      const extra = document.getElementById('settlement-search-extra');
      if (expandBtn && extra) {
        let expanded = true;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          extra.classList.toggle('hidden', !expanded);
          expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
          expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
        });
      }

      applySettlementGroupConstraint();
      updateSettlementToolbarState();
    });
  </script>
</body>
</html>
