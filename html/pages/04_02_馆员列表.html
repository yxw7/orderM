<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>馆员列表</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    /** 馆员列表：固定页面高度，表格区域独立滚动 */
    body[data-active-page="04_02_馆员列表.html"] #page-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body[data-active-page="04_02_馆员列表.html"] #librarian-page {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    body[data-active-page="04_02_馆员列表.html"] .librarian-table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    body[data-active-page="04_02_馆员列表.html"] .librarian-table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    body[data-active-page="04_02_馆员列表.html"] .librarian-table-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    /** 订户关联馆员弹窗：固定高度 */
    body[data-active-page="04_02_馆员列表.html"] #librarian-associate-modal .associate-modal-panel {
      height: 640px;
    }

    body[data-active-page="04_02_馆员列表.html"] #librarian-associate-transfer {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    body[data-active-page="04_02_馆员列表.html"] #librarian-associate-transfer .transfer-panel {
      height: 100%;
      min-height: 0;
    }

    body[data-active-page="04_02_馆员列表.html"] .transfer-left-list,
    body[data-active-page="04_02_馆员列表.html"] .transfer-right-list {
      overflow-y: auto;
    }

    body[data-active-page="04_02_馆员列表.html"] .transfer-left-list::-webkit-scrollbar,
    body[data-active-page="04_02_馆员列表.html"] .transfer-right-list::-webkit-scrollbar {
      width: 6px;
    }

    body[data-active-page="04_02_馆员列表.html"] .transfer-left-list::-webkit-scrollbar-thumb,
    body[data-active-page="04_02_馆员列表.html"] .transfer-right-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden"

      <div class="bg-white rounded border border-gray-200 p-4 mb-4 shrink-0">

            <button type="button" id="librarian-search-reset"
              class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
          </div>
          <div class="grid grid-cols-3 gap-4 pr-40">
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">馆员账号</label>
              <input type="text" name="account" placeholder="请输入"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">馆员姓名</label>
              <input type="text" name="name" placeholder="请输入"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">订户名称</label>
              <input type="text" name="subscriberName" placeholder="请输入"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center gap-2 col-span-1">
              <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">关联日期</label>
              <div class="flex flex-1 items-center gap-2">
                <input type="date" name="associateDateStart"
                  class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <span class="text-gray-400 text-sm">~</span>
                <input type="date" name="associateDateEnd"
                  class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              </div>
            </div>
          </div>
        </form>
      </div>

      <!-- 操作按钮 -->

        <button type="button" id="librarian-associate-btn"
          class="px-4 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">订户关联馆员</button>
      </div>

      <!-- 数据表格 -->
      <div class="bg-white rounded border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden">
        <div class="librarian-table-scroll table-scroll">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
              <tr>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap w-14">序号</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                  <span class="inline-flex items-center gap-1">
                    馆员账号
                    <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                  </span>
                </th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                  <span class="inline-flex items-center gap-1">
                    馆员姓名
                    <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                  </span>
                </th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[200px]">
                  <span class="inline-flex items-center gap-1">
                    订户名称

                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </svg>
                  </span>
                </th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                  <span class="inline-flex items-center gap-1">
                    关联日期
                    <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                  </span>
                </th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap sticky right-0 bg-gray-50">操作</th>

            </thead>

        </div>

            </button>

              </svg>

    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="associate-modal-panel bg-white rounded-lg shadow-xl w-full max-w-3xl flex flex-col"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">订户关联馆员</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="librarian-associate-form" class="px-6 py-5 flex flex-col flex-1 min-h-0 gap-4 overflow-hidden">
        <div class="flex items-start gap-3 shrink-0">
          <label class="text-sm text-gray-600 w-28 text-right pt-2 shrink-0">
            <span class="text-red-500">*</span> 订户名称
          </label>
          <div class="flex-1">
            <select name="subscriberName"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
              <option value="">请选择</option>
            </select>
            <p class="text-red-500 text-xs mt-1 hidden" data-error="subscriberName">请选择</p>
          </div>
        </div>
        <div id="librarian-associate-transfer" data-transfer-list></div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="librarian-associate-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">提交</button>
      </div>
    </div>
  </div>

      { account: 'STEAST01', name: '首图东馆采编1', subscribers: '东馆采编', date: '2020-05-14' },
      { account: 'STWEST01', name: '首图西馆采编1', subscribers: '西馆采编', date: '2020-05-13' },
      { account: 'STFLOW01', name: '首图流通部1', subscribers: '流通部', date: '2020-05-12' },
      { account: 'STFLOW02', name: '首图流通部2', subscribers: '流通部', date: '2020-05-11' },
      { account: 'STAV01', name: '首图视听编目1', subscribers: '视听中心', date: '2020-05-10' },
      { account: 'STAV02', name: '首图视听编目2', subscribers: '视听中心', date: '2020-05-09' },
      { account: 'STCB01', name: '首图采编中心1', subscribers: '采编中心', date: '2020-05-08' },
      { account: 'STCB02', name: '首图采编中心2', subscribers: '采编中心', date: '2020-05-07' }
    ];

    /** 全部馆员账号池 */
    let allLibrarianPool = [];

    /** 馆员账号与姓名映射 */
    let librarianNameByAccount = {};

    /** 当前展示的馆员列表 */
    let displayedLibrarianRows = [];

    /** 订户与馆员关联关系 */
    let subscriberLibrarianAssoc = {};

    /** 穿梭框实例 ID */
    let librarianTransferId = '';

    /**
     * 构建全部馆员池
     * @returns {string[]}
     */
    function buildAllLibrarianPool() {
      const accounts = new Set([
        ...librarianRows.map(row => row.account),
        ...extraLibrarians.map(item => item.account)
      ]);
      for (let i = 1; i <= 326; i += 1) {
        accounts.add(`STSYS${String(i).padStart(3, '0')}`);
      }
      return [...accounts].sort((a, b) => a.localeCompare(b, 'en'));
    }

    /**
     * 构建馆员账号与姓名映射
     * @returns {Record<string, string>}
     */
    function buildLibrarianNameByAccount() {
      /** @type {Record<string, string>} */
      const map = {};
      librarianRows.forEach(row => {
        map[row.account] = row.name;
      });
      extraLibrarians.forEach(item => {
        if (!map[item.account]) map[item.account] = item.name;
      });
      for (let i = 1; i <= 326; i += 1) {
        const account = `STSYS${String(i).padStart(3, '0')}`;
        if (!map[account]) map[account] = `系统馆员${String(i).padStart(3, '0')}`;
      }
      return map;
    }

    /**
     * 根据馆员列表构建订户关联关系
     * @returns {Record<string, string[]>}
     */
    function buildSubscriberLibrarianAssoc() {
      /** @type {Record<string, string[]>} */
      const map = {};
      librarianRows.forEach(row => {
        row.subscribers.split(/[,、]/).map(text => text.trim()).filter(Boolean).forEach(subscriber => {
          if (!map[subscriber]) map[subscriber] = [];
          if (!map[subscriber].includes(row.account)) map[subscriber].push(row.account);
        });
      });
      return map;
    }

    /**
     * 获取当前日期字符串
     * @returns {string}
     */
    function getTodayString() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${month}-${day}`;
    }

    /**
     * 将订户关联同步回馆员列表数据
     */
    function syncLibrarianRowsFromAssoc() {
      const librarianSubscriberMap = {};
      Object.entries(subscriberLibrarianAssoc).forEach(([subscriber, accounts]) => {
        accounts.forEach(account => {
          if (!librarianSubscriberMap[account]) librarianSubscriberMap[account] = [];
          if (!librarianSubscriberMap[account].includes(subscriber)) {
            librarianSubscriberMap[account].push(subscriber);
          }
        });
      });

      const existingAccounts = new Set(librarianRows.map(row => row.account));
      Object.keys(librarianSubscriberMap).forEach(account => {
        if (!existingAccounts.has(account)) {
          librarianRows.push({
            account,
            name: librarianNameByAccount[account] || account,
            subscribers: librarianSubscriberMap[account].join(', '),
            date: getTodayString()
          });
          existingAccounts.add(account);
        }
      });

      librarianRows.forEach(row => {
        row.subscribers = (librarianSubscriberMap[row.account] || []).join(', ');
      });
    }

    /**
     * 初始化订户名称下拉
     */
    function initAssociateSubscriberSelect() {
      const select = document.querySelector('#librarian-associate-form select[name="subscriberName"]');
      if (!select) return;
      select.innerHTML = '<option value="">请选择</option>' +
        activeSubscriberOptions.map(name => `<option value="${name}">${name}</option>`).join('');
    }

    /**
     * 根据选中订户刷新穿梭框
     * @param {string} subscriberName - 订户名称
     */
    function loadAssociateTransferBySubscriber(subscriberName) {
      const selected = subscriberName ? (subscriberLibrarianAssoc[subscriberName] || []) : [];
      TransferList.setSelected(librarianTransferId, selected);
    }

    /**
     * 打开订户关联馆员弹窗
     */
    function openLibrarianAssociateModal() {
      const form = document.getElementById('librarian-associate-form');
      if (!form) return;
      form.reset();
      form.querySelector('[data-error="subscriberName"]')?.classList.add('hidden');
      form.subscriberName?.classList.remove('border-red-500');
      TransferList.setSelected(librarianTransferId, []);
      document.getElementById('librarian-associate-modal')?.classList.remove('hidden');
    }

    /**
     * 校验关联表单
     * @param {HTMLFormElement} form - 表单
     * @returns {boolean}
     */
    function validateAssociateForm(form) {
      const errorEl = form.querySelector('[data-error="subscriberName"]');
      const selectEl = form.subscriberName;
      const valid = !!form.subscriberName.value;
      if (!valid) {
        errorEl?.classList.remove('hidden');
        selectEl?.classList.add('border-red-500');
      } else {
        errorEl?.classList.add('hidden');
        selectEl?.classList.remove('border-red-500');
      }
      return valid;
    }

    /**
     * 根据检索条件过滤馆员列表
     * @returns {typeof librarianRows}
     */
    function filterLibrarianRows() {
      const form = document.getElementById('librarian-search-form');
      if (!form) return [...librarianRows];

      const account = form.account?.value.trim() || '';
      const name = form.name?.value.trim() || '';
      const subscriberName = form.subscriberName?.value.trim() || '';
      const dateStart = form.associateDateStart?.value || '';
      const dateEnd = form.associateDateEnd?.value || '';

      return librarianRows.filter(row => {
        if (account && !row.account.includes(account)) return false;
        if (name && !row.name.includes(name)) return false;
        if (subscriberName && !row.subscribers.includes(subscriberName)) return false;
        if (dateStart && row.date < dateStart) return false;
        if (dateEnd && row.date > dateEnd) return false;
        return true;
      });
    }

    /**
     * 渲染馆员表格
     */
    function renderLibrarianTable() {
      const tbody = document.getElementById('librarian-table-body');
      if (!tbody) return;
      displayedLibrarianRows = filterLibrarianRows();
      tbody.innerHTML = displayedLibrarianRows.map((row, i) => renderLibrarianRow(row, i + 1)).join('');
      const totalEl = document.getElementById('librarian-total-count');
      if (totalEl) totalEl.textContent = `共 ${displayedLibrarianRows.length} 条记录`;
    }

    /**
     * 渲染馆员表格行
     * @param {Object} row - 行数据
     * @param {number} index - 行序号
     * @returns {string}
     */
    function renderLibrarianRow(row, index) {
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${index}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.account}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.name}</td>
          <td class="px-3 py-2 text-gray-600 leading-relaxed">${row.subscribers}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.date}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">
            <a href="04_02_03_取消关联.html" class="text-sky-600 hover:underline">取消关联</a>
          </td>
        </tr>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      allLibrarianPool = buildAllLibrarianPool();
      librarianNameByAccount = buildLibrarianNameByAccount();
      subscriberLibrarianAssoc = buildSubscriberLibrarianAssoc();
      initAssociateSubscriberSelect();
      librarianTransferId = TransferList.init(
        document.getElementById('librarian-associate-transfer'),
        {
          items: allLibrarianPool,
          selected: [],
          leftSearchPlaceholder: '请输入馆员账号',
          leftFilter: account => account,
          leftLabel: account => account
        }
      );
      renderLibrarianTable();

      document.getElementById('librarian-search-form')?.addEventListener('submit', e => {
        e.preventDefault();
        renderLibrarianTable();
      });

      document.getElementById('librarian-search-reset')?.addEventListener('click', () => {
        Common.resetForm('librarian-search-form');
        renderLibrarianTable();
      });

      document.getElementById('librarian-associate-btn')?.addEventListener('click', openLibrarianAssociateModal);

      document.querySelector('#librarian-associate-form select[name="subscriberName"]')
        ?.addEventListener('change', e => {
          loadAssociateTransferBySubscriber(e.target.value);
        });

      document.getElementById('librarian-associate-submit')?.addEventListener('click', () => {
        const form = document.getElementById('librarian-associate-form');
        if (!form || !validateAssociateForm(form)) return;

        const subscriberName = form.subscriberName.value;
        subscriberLibrarianAssoc[subscriberName] = TransferList.getSelected(librarianTransferId);
        syncLibrarianRowsFromAssoc();
        librarianNameByAccount = buildLibrarianNameByAccount();
        renderLibrarianTable();
        document.getElementById('librarian-associate-modal')?.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
