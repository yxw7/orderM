<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>逐条收货</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body.receive-detail-drawer-open {
      overflow: hidden;
    }

    .receive-detail-drawer {
      position: fixed;
      inset: 0;
      z-index: 70;
    }

    .receive-detail-drawer.hidden {
      pointer-events: none;
    }

    .receive-detail-drawer-mask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .receive-detail-drawer.is-open .receive-detail-drawer-mask {
      opacity: 1;
    }

    .receive-detail-drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 75%;
      max-width: 100%;
      background: #fff;
      box-shadow: -8px 0 24px rgba(15, 23, 42, 0.12);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .receive-detail-drawer.is-open .receive-detail-drawer-panel {
      transform: translateX(0);
    }

    .receive-detail-drawer.is-open {
      pointer-events: auto;
    }

    .receive-detail-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e5e7eb;
      shrink: 0;
    }

    .receive-detail-drawer-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #f3f4f6;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="逐条收货"
  data-active-page="02_02_逐条收货_纸质书.html"
  data-page-tabs='[{"label":"订单管理","page":"01_01_非连续出版物订单-订单列表.html"},{"label":"逐条收货","active":true}]'>

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden flex flex-col h-full overflow-hidden">
    <!-- 验收单摘要信息 -->
    <div class="bg-white rounded border border-gray-200 px-5 py-3 mb-4 shrink-0">
      <div class="flex items-start justify-between gap-4">
        <div class="flex flex-wrap items-center gap-x-10 gap-y-2 text-sm text-gray-700 flex-1 min-w-0">
          <span>验收单名称：<span id="receive-acceptance-name" class="text-gray-900">—</span></span>
          <span>供应商：<span id="receive-acceptance-supplier" class="text-gray-900">—</span></span>
          <span>语种：<span id="receive-acceptance-lang" class="text-gray-900">—</span></span>
          <span>发货单号：<span id="receive-acceptance-shipno" class="text-gray-900">—</span></span>
        </div>
        <button type="button" id="receive-view-detail-btn" disabled
          class="shrink-0 text-sm bg-transparent border-0 p-0 font-normal text-gray-300 cursor-default">
          查看详情
        </button>
      </div>
      <p id="receive-acceptance-hint" class="text-xs text-amber-600 mt-2">
        请先在「验收单管理」列表选择设为验收单，或在新增/编辑窗口勾选「设为当前工作验收单」
      </p>
    </div>

    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 px-5 py-3 mb-4 shrink-0">
      <form id="receive-search-form" class="flex items-center gap-3 flex-wrap">
        <select id="receive-search-field" name="searchField" disabled
          class="border border-gray-300 rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-sky-500 w-32 disabled:bg-gray-100 disabled:text-gray-400">
          <option value="">请先选择验收单</option>
        </select>
        <input type="text" name="keyword" placeholder="请输入" disabled
          class="receive-search-input flex-1 max-w-md border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500 disabled:bg-gray-100">
        <select id="receive-carrier-field" name="carrier" disabled
          class="hidden border border-gray-300 rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-sky-500 w-36 disabled:bg-gray-100 disabled:text-gray-400">
          <option value="">请选择载体</option>
          <option value="CD">CD</option>
          <option value="LP">LP</option>
          <option value="DVD">DVD</option>
          <option value="蓝光">蓝光</option>
          <option value="磁带">磁带</option>
        </select>
        <button type="submit"
          class="flex items-center gap-1.5 px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          检索
        </button>
      </form>
    </div>

    <!-- 订单行信息表格 -->
    <div class="bg-white rounded border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden">
      <div class="flex-1 overflow-auto table-scroll">
        <table class="w-full text-sm">
          <thead id="receive-table-head" class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10"></thead>
          <tbody id="receive-table-body"></tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div id="receive-pagination" class="hidden flex items-center justify-between px-4 py-3 border-t border-gray-200 shrink-0 bg-white">
        <span class="text-sm text-gray-500" id="receive-total">总共 0 个项目</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">2</button>
          <button type="button" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">3</button>
          <button type="button" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">4</button>
          <button type="button" class="px-3 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">5</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option selected>5 条/页</option>
            <option>10 条/页</option>
            <option>20 条/页</option>
          </select>
          <span class="text-sm text-gray-500">跳至</span>
          <input type="text" class="w-12 border border-gray-300 rounded px-2 py-1 text-sm text-center" value="1">
          <span class="text-sm text-gray-500">页</span>
        </div>
      </div>
    </div>

    <!-- 底部操作按钮 -->
    <div class="flex items-center justify-center gap-4 mt-4 pb-4 shrink-0">
      <button type="button" data-receive-op data-receive-op-type="receive" disabled
        class="px-8 py-2 bg-emerald-500 text-white text-sm rounded hover:bg-emerald-600 shadow-sm opacity-50 disabled:cursor-not-allowed">收货</button>
      <button type="button" data-receive-op data-receive-op-type="exchange" disabled
        class="px-8 py-2 bg-sky-600 text-white text-sm rounded hover:bg-sky-700 shadow-sm opacity-50 disabled:cursor-not-allowed">换货</button>
      <button type="button" data-receive-op data-receive-op-type="return" disabled
        class="px-8 py-2 bg-orange-500 text-white text-sm rounded hover:bg-orange-600 shadow-sm opacity-50 disabled:cursor-not-allowed">退货</button>
    </div>
  </div>

  <!-- 验收详情侧滑面板 -->
  <div id="receive-detail-drawer" class="receive-detail-drawer hidden" aria-hidden="true">
    <div id="receive-detail-drawer-mask" class="receive-detail-drawer-mask"></div>
    <aside id="receive-detail-drawer-panel" class="receive-detail-drawer-panel" role="dialog" aria-modal="true"
      aria-labelledby="receive-detail-drawer-title">
      <div class="receive-detail-drawer-header">
        <h2 id="receive-detail-drawer-title" class="text-base font-medium text-gray-800">验收详情</h2>
        <button type="button" id="receive-detail-drawer-close" aria-label="关闭"
          class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>
      <iframe id="receive-detail-drawer-frame" class="receive-detail-drawer-frame" title="验收详情"></iframe>
    </aside>
  </div>

  <!-- 新增收货弹窗（纸质书） -->
  <div id="paper-receive-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl flex flex-col max-h-[90vh]"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">新增收货</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="paper-receive-form" class="px-6 py-5 overflow-y-auto space-y-4">
        <div class="bg-gray-50 rounded px-4 py-3 flex flex-wrap gap-x-6 gap-y-2 text-sm text-gray-700">
          <div class="flex items-center gap-2">
            <label class="whitespace-nowrap">发订套数</label>
            <input type="text" name="orderedSets"
              class="w-16 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="whitespace-nowrap">已收货套数</label>
            <input type="text" name="receivedSets"
              class="w-16 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="whitespace-nowrap">待收货套数</label>
            <input type="text" name="pendingSets"
              class="w-16 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="flex items-center gap-3">
            <label class="text-sm text-gray-600 w-20 text-right shrink-0">ISBN</label>
            <input type="text" name="isbn"
              class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-3">
            <label class="text-sm text-gray-600 w-20 text-right shrink-0">作者</label>
            <input type="text" name="author"
              class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-20 text-right shrink-0">
            <span class="text-red-500">*</span> 正题名
          </label>
          <input type="text" name="title"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
        </div>
        <div id="paper-receive-price-row" class="grid grid-cols-3 gap-4">
          <div id="paper-receive-slot-original-price" class="hidden">
            <div class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-20 text-right shrink-0">
                <span class="text-red-500">*</span> 原定价
              </label>
              <input type="text" name="originalPrice"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
          <div id="paper-receive-slot-price-cn">
            <div id="paper-receive-price-field" class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-20 text-right shrink-0">
                <span class="text-red-500">*</span> 定价
              </label>
              <input type="text" name="price"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
          <div id="paper-receive-slot-currency">
            <div class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-16 text-right shrink-0">币种</label>
              <select name="currency" id="paper-receive-currency"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
                <option value="CNY">CNY - 人民币</option>
                <option value="USD">USD - 美元</option>
                <option value="EUR">EUR - 欧元</option>
                <option value="GBP">GBP - 英镑</option>
                <option value="JPY">JPY - 日元</option>
                <option value="HKD">HKD - 港币</option>
              </select>
            </div>
          </div>
          <div id="paper-receive-slot-price-foreign" class="hidden"></div>
          <div id="paper-receive-slot-actual-cn">
            <div id="paper-receive-actual-price-field" class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-20 text-right shrink-0">
                <span class="text-red-500">*</span> 实洋
              </label>
              <input type="text" name="actualPrice"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
        </div>
        <div id="paper-receive-quantity-row" class="grid grid-cols-3 gap-4">
          <div id="paper-receive-slot-actual-foreign" class="hidden"></div>
          <div id="paper-receive-slot-volumes">
            <div class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-24 text-right shrink-0">
                <span class="text-red-500">*</span> 套内册数
              </label>
              <input type="text" name="volumesPerSet"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
          <div id="paper-receive-slot-receive-sets">
            <div class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-20 text-right shrink-0">收货套数</label>
              <input type="text" name="receiveSets"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
          <div id="paper-receive-slot-barcode-cn">
            <div id="paper-receive-barcode-field" class="flex items-center gap-3">
              <label class="text-sm text-gray-600 w-24 text-right shrink-0">
                <span class="text-red-500">*</span> 条码初始号
              </label>
              <input type="text" name="barcodeStart"
                class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
        </div>
        <div id="paper-receive-barcode-row-foreign" class="hidden">
          <div id="paper-receive-slot-barcode-foreign"></div>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-20 text-right pt-2 shrink-0">收货备注</label>
          <div class="flex-1 relative">
            <textarea name="remark" rows="4" maxlength="200" placeholder="请输入收货备注"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500 resize-none"></textarea>
            <span id="paper-receive-remark-count" class="absolute bottom-2 right-3 text-xs text-gray-400">0</span>
          </div>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="paper-receive-preview"
          class="px-5 py-1.5 text-sm rounded bg-amber-500 text-white hover:bg-amber-600">预览</button>
        <button type="button" id="paper-receive-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">收货</button>
      </div>
    </div>
  </div>

  <!-- 新增换货弹窗 -->
  <div id="paper-exchange-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">新增换货</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="paper-exchange-form" class="px-6 py-5 overflow-y-auto space-y-4">
        <div id="paper-exchange-summary"
          class="bg-gray-50 rounded px-4 py-3 text-sm text-gray-700"></div>
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-20 text-right shrink-0">
            <span class="text-red-500">*</span> 换货数量
          </label>
          <input type="text" name="exchangeQty" placeholder="请输入"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-20 text-right shrink-0">
            <span class="text-red-500">*</span> 换货原因
          </label>
          <select name="exchangeReason"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
            <option value="">请选择</option>
            <option value="换货">换货</option>
            <option value="残缺损">残缺损</option>
          </select>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-20 text-right pt-2 shrink-0">换货备注</label>
          <div class="flex-1 relative">
            <textarea name="remark" rows="4" maxlength="500" placeholder="请输入换货备注"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500 resize-none"></textarea>
            <span id="paper-exchange-remark-count" class="absolute bottom-2 right-3 text-xs text-gray-400">0 / 500</span>
          </div>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="paper-exchange-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">换货</button>
      </div>
    </div>
  </div>

  <!-- 新增退货弹窗 -->
  <div id="paper-return-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">新增退货</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="paper-return-form" class="px-6 py-5 overflow-y-auto space-y-4">
        <div id="paper-return-summary"
          class="bg-gray-50 rounded px-4 py-3 text-sm text-gray-700"></div>
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-20 text-right shrink-0">
            <span class="text-red-500">*</span> 退货数量
          </label>
          <input type="text" name="returnQty" placeholder="请输入"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-20 text-right shrink-0">
            <span class="text-red-500">*</span> 退货原因
          </label>
          <select name="returnReason"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
            <option value="">请选择</option>
            <option value="退货">退货</option>
            <option value="损坏退货">损坏退货</option>
          </select>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-20 text-right pt-2 shrink-0">退货备注</label>
          <div class="flex-1 relative">
            <textarea name="remark" rows="4" maxlength="500" placeholder="请输入退货备注"
              class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500 resize-none"></textarea>
            <span id="paper-return-remark-count" class="absolute bottom-2 right-3 text-xs text-gray-400">0 / 500</span>
          </div>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="paper-return-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">退货</button>
      </div>
    </div>
  </div>

  <!-- 新增收货弹窗（视听资料） -->
  <div id="av-receive-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">

    /**

     * @param {string} counts - 套数字符串
     * @returns {{ordered: number, received: number, pending: number}}
     */
    function parsePaperCounts(counts) {
      const parts = (counts || '0/0/0/0').split('/').map(Number);
      const ordered = parts[0] || 0;
      const received = parts[1] || 0;
      return { ordered, received, pending: Math.max(ordered - received, 0) };
    }

    /**
     * 解析条码号末尾数字段
     * @param {string} barcode - 条码号
     * @returns {{ prefix: string, number: number, padLength: number } | null}
     */
    function parseBarcodeNumber(barcode) {
      const match = String(barcode || '').trim().match(/^(.+?)(\d+)$/);
      if (!match) return null;
      return {
        prefix: match[1],
        number: Number(match[2]),
        padLength: match[2].length
      };
    }

    /**
     * 格式化条码号
     * @param {string} prefix - 前缀
     * @param {number} number - 序号
     * @param {number} padLength - 数字位宽
     * @returns {string}
     */
    function formatBarcodeNumber(prefix, number, padLength) {
      return `${prefix}${String(number).padStart(padLength, '0')}`;
    }

    /**
     * 根据收货表单计算条码预分配结果
     * @param {string} barcodeStart - 条码初始号
     * @param {number} receiveSets - 收货套数
     * @param {number} volumesPerSet - 套内册数
     * @returns {{ allocated: string, unallocated: string }}
     */
    function calcBarcodePreview(barcodeStart, receiveSets, volumesPerSet) {
      const total = receiveSets * volumesPerSet;
      if (!barcodeStart || total <= 0) {
        return { allocated: '', unallocated: '无' };
      }
      const parsed = parseBarcodeNumber(barcodeStart);
      if (!parsed) {
        return { allocated: barcodeStart, unallocated: '无' };
      }
      const endNumber = parsed.number + total - 1;
      const startBarcode = formatBarcodeNumber(parsed.prefix, parsed.number, parsed.padLength);
      const endBarcode = formatBarcodeNumber(parsed.prefix, endNumber, parsed.padLength);
      const allocated = total === 1 ? startBarcode : `${startBarcode}-${endBarcode}`;
      return { allocated, unallocated: '无' };
    }

      const unallocatedEl = document.getElementById('paper-barcode-preview-unallocated');
      if (!form || !modal || !allocatedEl || !unallocatedEl) return;

      const barcodeStart = form.elements.barcodeStart.value.trim();
      const receiveSets = Number(form.elements.receiveSets.value);
      const volumesPerSet = Number(form.elements.volumesPerSet.value);

      if (!barcodeStart) {

        return;

      if (!receiveSets || receiveSets <= 0) {

        return;
      }
      if (!volumesPerSet || volumesPerSet <= 0) {
        alert('请输入有效的套内册数');
        return;
      }

      const result = calcBarcodePreview(barcodeStart, receiveSets, volumesPerSet);
      allocatedEl.textContent = result.allocated;
      unallocatedEl.textContent = result.unallocated;
      modal.classList.remove('hidden');
    }

     * @param {string|number} originalPrice - 原定价
     * @param {string} currency - 币种代码

     */
    function convertToRmbPrice(originalPrice, currency) {

      return (amount * rate).toFixed(2);

      const form = document.getElementById('paper-exchange-form');
      const summary = document.getElementById('paper-exchange-summary');
      if (!row || !modal || !form || !summary) return;

      const ordered = row.orderedSets ?? parsePaperCounts(row.counts).ordered;
      const received = row.receivedSets ?? parsePaperCounts(row.counts).received;
      const pending = row.pendingSets ?? parsePaperCounts(row.counts).pending;
      const volumesPerSet = row.copies || 0;

      summary.textContent =
        `套内册数：${volumesPerSet}，发订套数：${ordered}，已收货套数：${received}，待收货套数：${pending}`;

      form.elements.exchangeQty.value = '';
      form.elements.exchangeReason.value = '';
      form.elements.remark.value = '';
      document.getElementById('paper-exchange-remark-count').textContent = '0 / 500';

      modal.classList.remove('hidden');
    }

    /**
     * 打开新增退货弹窗
     */
    function openPaperReturnModal() {
      const current = AcceptanceStore.get();
      if (!current) {
        alert('请先在验收单管理中选择当前工作验收单');
        return;
      }
      if (current.type !== '纸质书' && current.type !== '视听资料') return;
      if (!receiveSearchDone) {
        alert('请先检索订单行数据');
        return;
      }
      const row = getSelectedOrderRow(current.type);
      if (!row) {
        alert('请先选择一条订单行数据');
        return;
      }
      const modal = document.getElementById('paper-return-modal');
      const form = document.getElementById('paper-return-form');
      const summary = document.getElementById('paper-return-summary');
      if (!row || !modal || !form || !summary) return;

      const ordered = row.orderedSets ?? parsePaperCounts(row.counts).ordered;
      const received = row.receivedSets ?? parsePaperCounts(row.counts).received;
      const pending = row.pendingSets ?? parsePaperCounts(row.counts).pending;
      const volumesPerSet = row.copies || 0;

      summary.textContent =
        `套内册数：${volumesPerSet}，发订套数：${ordered}，已收货套数：${received}，待收货套数：${pending}`;

      form.elements.returnQty.value = '';
      form.elements.returnReason.value = '';
      form.elements.remark.value = '';
      document.getElementById('paper-return-remark-count').textContent = '0 / 500';

      modal.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      AcceptanceStore.renderReceiveSummary();
      AcceptanceStore.bindReceiveOperations();
      ReceiveDetailDrawer.bind();
      ReceiveDetailDrawer.syncViewDetailButton();

      const searchForm = document.getElementById('receive-search-form');
      if (searchForm) {
        searchForm.addEventListener('submit', e => {
          e.preventDefault();
          const current = AcceptanceStore.get();
          if (!current) {
            alert('请先在验收单管理中选择当前工作验收单');
            return;
          }
          if (current.type === '纸质书') renderPaperBookSearchResults();
          if (current.type === '视听资料') renderAvSearchResults();
        });
      }

      const receiveBtn = document.querySelector('[data-receive-op-type="receive"]');
      if (receiveBtn) {
        receiveBtn.addEventListener('click', () => {
          const current = AcceptanceStore.get();
          if (!current) {
            alert('请先在验收单管理中选择当前工作验收单');
            return;
          }
          if (current.type === '纸质书') openPaperReceiveModal();
          if (current.type === '视听资料') openAvReceiveModal();
        });
      }

      const exchangeBtn = document.querySelector('[data-receive-op-type="exchange"]');
      if (exchangeBtn) {
        exchangeBtn.addEventListener('click', () => {
          const current = AcceptanceStore.get();
          if (!current) {
            alert('请先在验收单管理中选择当前工作验收单');
            return;
          }
          if (current.type === '纸质书' || current.type === '视听资料') {
            openPaperExchangeModal();
          }
        });
      }

      const returnBtn = document.querySelector('[data-receive-op-type="return"]');
      if (returnBtn) {
        returnBtn.addEventListener('click', () => {
          const current = AcceptanceStore.get();
          if (!current) {
            alert('请先在验收单管理中选择当前工作验收单');
            return;
          }
          if (current.type === '纸质书' || current.type === '视听资料') {
            openPaperReturnModal();
          }
        });
      }

      const remarkArea = document.querySelector('#paper-receive-form textarea[name="remark"]');
      const remarkCount = document.getElementById('paper-receive-remark-count');
      if (remarkArea && remarkCount) {
        remarkArea.addEventListener('input', () => {
          remarkCount.textContent = String(remarkArea.value.length);
        });
      }

      const receiveModal = document.getElementById('paper-receive-modal');
      document.getElementById('paper-receive-submit')?.addEventListener('click', () => {
        if (receiveModal) receiveModal.classList.add('hidden');
      });

      const avReceiveModal = document.getElementById('av-receive-modal');
      document.getElementById('av-receive-submit')?.addEventListener('click', () => {
        const form = document.getElementById('av-receive-form');
        if (!form) return;
        if (!form.elements.carrier.value) {
          alert('请选择载体');
          return;
        }
        if (!form.elements.title.value.trim()) {
          alert('请输入题名');
          return;
        }
        if (!form.elements.price.value.trim()) {
          alert('请输入码洋');
          return;
        }
        if (!form.elements.actualPrice.value.trim()) {
          alert('请输入实洋');
          return;
        }
        if (!form.elements.copies.value.trim()) {
          alert('请输入套内件数');
          return;
        }
        if (avReceiveModal) avReceiveModal.classList.add('hidden');
      });

      const avRemarkArea = document.querySelector('#av-receive-form textarea[name="remark"]');
      const avRemarkCount = document.getElementById('av-receive-remark-count');
      if (avRemarkArea && avRemarkCount) {
        avRemarkArea.addEventListener('input', () => {
          avRemarkCount.textContent = String(avRemarkArea.value.length);
        });
      }

      const exchangeModal = document.getElementById('paper-exchange-modal');
      document.getElementById('paper-exchange-submit')?.addEventListener('click', () => {
        const form = document.getElementById('paper-exchange-form');
        if (!form) return;
        if (!form.elements.exchangeQty.value.trim()) {
          alert('请输入换货数量');
          return;
        }
        if (!form.elements.exchangeReason.value) {
          alert('请选择换货原因');
          return;
        }
        if (exchangeModal) exchangeModal.classList.add('hidden');
      });

      const exchangeRemarkArea = document.querySelector('#paper-exchange-form textarea[name="remark"]');
      const exchangeRemarkCount = document.getElementById('paper-exchange-remark-count');
      if (exchangeRemarkArea && exchangeRemarkCount) {
        exchangeRemarkArea.addEventListener('input', () => {
          exchangeRemarkCount.textContent = `${exchangeRemarkArea.value.length} / 500`;
        });
      }

      const returnModal = document.getElementById('paper-return-modal');
      document.getElementById('paper-return-submit')?.addEventListener('click', () => {
        const form = document.getElementById('paper-return-form');
        if (!form) return;
        if (!form.elements.returnQty.value.trim()) {
          alert('请输入退货数量');
          return;
        }
        if (!form.elements.returnReason.value) {
          alert('请选择退货原因');
          return;
        }
        if (returnModal) returnModal.classList.add('hidden');
      });

      const returnRemarkArea = document.querySelector('#paper-return-form textarea[name="remark"]');
      const returnRemarkCount = document.getElementById('paper-return-remark-count');
      if (returnRemarkArea && returnRemarkCount) {
        returnRemarkArea.addEventListener('input', () => {
          returnRemarkCount.textContent = `${returnRemarkArea.value.length} / 500`;
        });
      }

      document.getElementById('paper-receive-preview')?.addEventListener('click', openPaperBarcodePreviewModal);
      document.getElementById('paper-barcode-preview-accept')?.addEventListener('click', closePaperBarcodePreviewModal);
      document.getElementById('paper-barcode-preview-reject')?.addEventListener('click', closePaperBarcodePreviewModal);

      const barcodePreviewModal = document.getElementById('paper-barcode-preview-modal');
      if (barcodePreviewModal) {
        barcodePreviewModal.addEventListener('click', e => {
          if (e.target === barcodePreviewModal) closePaperBarcodePreviewModal();
        });
      }
    });
  </script>
</body>
</html>
