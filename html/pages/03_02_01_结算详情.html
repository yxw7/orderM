<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结算详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="结算详情"
  data-active-page="03_02_已结算.html"
  data-page-tabs='[{"label":"已结算","page":"03_02_已结算.html"},{"label":"结算详情","active":true}]'>

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <!-- 面包屑 -->
    <div class="flex items-center gap-2 mb-4 text-sm">
      <a href="03_02_已结算.html" class="flex items-center gap-1 text-gray-500 hover:text-sky-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        已结算
      </a>
      <span class="text-gray-400">/</span>
      <span class="text-gray-800">结算详情</span>
    </div>

    <!-- 结算概要 -->
    <div class="bg-white rounded border border-gray-200 p-5 mb-4">
      <h2 class="text-base font-medium text-gray-800 mb-4">结算详情</h2>
      <div id="settlement-detail-summary" class="space-y-3 text-sm"></div>
    </div>

    <!-- 验收批次明细 -->
    <div class="bg-white rounded border border-gray-200">
      <div class="overflow-x-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">验收批次号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[160px]">供应商</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">发货单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收种数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收套数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收册数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收总码洋(元)</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收总实洋(元)</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[200px]">预算名称</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100" id="settlement-detail-table-body"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
        <span class="text-sm text-gray-500" id="settlement-detail-total">共 0 条</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option>10 条/页</option>
            <option>20 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 结算详情示例数据 */
    const settlementDetailMap = {
      jsPG00120260602001: {
        settleId: 'jsPG00120260602001',
        settleTime: '2026-06-02 09:53:18',
        operator: '杨现规',
        remark: 'jiesuan20260602测试',
        totals: { species: 0, sets: 0, volumes: 0, listPrice: '0.00', netPrice: '0.00' },
        items: [
          {
            no: 1,
            acceptId: 'ysPG00120260602001',
            supplier: '北京市图书进出口有限公司',
            deliveryId: '997765460',
            species: 0,
            sets: 0,
            volumes: 0,
            listPrice: '0.00',
            netPrice: '0.00',
            budget: '2026年首都图书馆图书购置费中文普通图书(五)'
          }
        ]
      },
      jsPG09120260602001: {
        settleId: 'jsPG09120260602001',
        settleTime: '2020-06-02 09:53:18',
        operator: '系统',
        remark: '纸质书20260602001结算',
        totals: { species: 12, sets: 8, volumes: 20, listPrice: '1580.00', netPrice: '1280.00' },
        items: [
          {
            no: 1,
            acceptId: 'ysPG09120260602001',
            supplier: '北京人天',
            deliveryId: 'fhPG09120260602001',
            species: 12,
            sets: 8,
            volumes: 20,
            listPrice: '1580.00',
            netPrice: '1280.00',
            budget: '集团2020年度预算'
          }
        ]
      },
      jsPG09120260602002: {
        settleId: 'jsPG09120260602002',
        settleTime: '2020-06-02 10:12:05',
        operator: '李佳',
        remark: '',
        totals: { species: 5, sets: 3, volumes: 8, listPrice: '680.00', netPrice: '560.00' },
        items: [
          {
            no: 1,
            acceptId: 'ysPG09120260602002',
            supplier: '北京新华',
            deliveryId: 'fhPG09120260602002',
            species: 5,
            sets: 3,
            volumes: 8,
            listPrice: '680.00',
            netPrice: '560.00',
            budget: '集团2020年度预算'
          }
        ]
      }
    };

    /** 默认结算详情（未匹配结算单号时使用） */
    const defaultSettlementDetail = settlementDetailMap.jsPG00120260602001;

    /**
     * 渲染概要字段（标签与值同一行）
     * @param {string} label - 字段标签
     * @param {string|number} value - 字段值
     * @returns {string}
     */
    function renderSummaryField(label, value) {
      return `<div class="flex items-center whitespace-nowrap">
        <span class="text-gray-500">${label}：</span>
        <span class="text-gray-900">${value}</span>
      </div>`;
    }

    /**
     * 渲染结算概要区
     * @param {Object} detail - 结算详情数据
     * @returns {string}
     */
    function renderSettlementSummary(detail) {
      const remark = detail.remark || '—';
      const totals = detail.totals;
      return `
        <div class="flex flex-wrap items-center gap-x-12 gap-y-2">
          ${renderSummaryField('结算单号', detail.settleId)}
          ${renderSummaryField('结算时间', detail.settleTime)}
          ${renderSummaryField('结算操作人', detail.operator)}
        </div>
        <div class="flex items-start gap-1">
          <span class="text-gray-500 shrink-0">结算备注：</span>
          <span class="text-gray-900">${remark}</span>
        </div>
        <div class="flex flex-wrap items-center gap-x-10 gap-y-2 pt-1">
          ${renderSummaryField('实收总种数', totals.species)}
          ${renderSummaryField('实收总套数', totals.sets)}
          ${renderSummaryField('实收总册数', totals.volumes)}
          ${renderSummaryField('实收总码洋(元)', totals.listPrice)}
          ${renderSummaryField('实收总实洋(元)', totals.netPrice)}
        </div>`;
    }

    /**
     * 渲染验收批次表格行
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderDetailTableRow(row) {
      const delivery = row.deliveryId || '—';
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${row.no}</td>
          <td class="px-3 py-2 whitespace-nowrap">
            <a href="02_01_02_验收详情按种_纸质书.html" class="text-sky-600 hover:underline">${row.acceptId}</a>
          </td>
          <td class="px-3 py-2">${row.supplier}</td>
          <td class="px-3 py-2 text-gray-500">${delivery}</td>
          <td class="px-3 py-2">${row.species}</td>
          <td class="px-3 py-2">${row.sets}</td>
          <td class="px-3 py-2">${row.volumes}</td>
          <td class="px-3 py-2">${row.listPrice}</td>
          <td class="px-3 py-2">${row.netPrice}</td>
          <td class="px-3 py-2">${row.budget}</td>
        </tr>`;
    }

    /**
     * 根据 URL 参数获取结算单号
     * @returns {string}
     */
    function getSettleIdFromUrl() {
      const params = new URLSearchParams(location.search);
      return params.get('id') || '';
    }

    /**
     * 根据结算单号获取详情数据
     * @param {string} settleId - 结算单号
     * @returns {Object}
     */
    function getSettlementDetail(settleId) {
      return settlementDetailMap[settleId] || defaultSettlementDetail;
    }

    /**
     * 初始化结算详情页
     */
    function initSettlementDetailPage() {
      const settleId = getSettleIdFromUrl();
      const detail = getSettlementDetail(settleId);
      const summaryEl = document.getElementById('settlement-detail-summary');
      const tbody = document.getElementById('settlement-detail-table-body');
      const totalEl = document.getElementById('settlement-detail-total');
      if (!summaryEl || !tbody || !totalEl) return;

      summaryEl.innerHTML = renderSettlementSummary(detail);
      tbody.innerHTML = detail.items.map(renderDetailTableRow).join('');
      totalEl.textContent = `共 ${detail.items.length} 条`;
    }

    document.addEventListener('DOMContentLoaded', initSettlementDetailPage);
  </script>
</body>
</html>
