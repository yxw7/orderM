<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    /** 订户列表：固定页面高度，表格区域独立滚动 */
    body[data-active-page="04_01订户列表.html"] #page-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body[data-active-page="04_01订户列表.html"] #subscriber-page {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    body[data-active-page="04_01订户列表.html"] .subscriber-table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    body[data-active-page="04_01订户列表.html"] .subscriber-table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    body[data-active-page="04_01订户列表.html"] .subscriber-table-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    body[data-active-page="04_01订户列表.html"] .subscriber-librarian-table-scroll::-webkit-scrollbar {
      width: 6px;
    }

    body[data-active-page="04_01订户列表.html"] .subscriber-librarian-table-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="订户列表"

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <div id="subscriber-page">
    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4 shrink-0">
      <form id="subscriber-search-form" class="relative">
        <div class="absolute top-0 right-0 flex items-center gap-2">
          <button type="button" id="subscriber-search-expand"
            class="flex items-center gap-1 text-sm text-sky-600 hover:text-sky-700">
            <span id="subscriber-search-expand-text">展开</span>
            <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <button type="submit"
            class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">检索</button>
          <button type="button" id="subscriber-search-reset"
            class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
        </div>
        <div class="grid grid-cols-3 gap-4 pr-56">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">订户名称</label>
            <input type="text" name="name" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">资源类型</label>
            <select name="resourceType"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option value="">全部</option>
              <option value="纸质书">纸质书</option>
              <option value="视听资料">视听资料</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">预算名称</label>
            <input type="text" name="budget" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
        </div>
        <div id="subscriber-search-extra" class="hidden grid grid-cols-3 gap-4 mt-3 pr-56">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">订户状态</label>
            <select name="status"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option value="">全部</option>
              <option value="active">使用中</option>
              <option value="disabled">已停用</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">创建日期</label>
            <div class="flex flex-1 items-center gap-2">
              <input type="date" name="startDate" placeholder="开始日期"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <span class="text-gray-400 text-sm">~</span>
              <input type="date" name="endDate" placeholder="结束日期"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4 shrink-0">
      <button type="button" id="subscriber-add-btn"
        class="inline-flex items-center gap-1 px-4 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">
        <span class="text-base leading-none">+</span>

              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">订户状态</th>

              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">

        </table>

            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

      </div>
    </div>

  <!-- 查看馆员弹窗 -->

      const map = {};
      librarianSourceRows.forEach(item => {
        item.subscribers.split(/[,、]/).map(text => text.trim()).filter(Boolean).forEach(subscriber => {
          if (!map[subscriber]) map[subscriber] = [];
          if (!map[subscriber].includes(item.name)) map[subscriber].push(item.name);
        });
      });
      return map;

    /**

     */
    function sortSubscriberRows(rows) {
      return [...rows].sort((a, b) => {
        const diff = a.created.localeCompare(b.created);
        return subscriberCreatedSort === 'desc' ? -diff : diff;
      });
    }

    /**
     * 按检索条件过滤订户列表
     * @param {Object[]} rows - 行数据
     * @param {HTMLFormElement} form - 检索表单
     * @returns {Object[]}
     */
    function filterSubscriberRows(rows, form) {
      const name = form.name.value.trim();
      const resourceType = form.resourceType.value;
      const budget = form.budget.value.trim();
      const status = form.status.value;
      const startDate = form.startDate.value;
      const endDate = form.endDate.value || startDate;

      return rows.filter(row => {
        if (name && !row.name.includes(name)) return false;
        if (resourceType && !(row.types || []).includes(resourceType)) return false;
        if (budget && !(row.budgets || []).some(item => item.includes(budget))) return false;
        if (status && row.status !== status) return false;
        if (startDate) {
          const created = row.created;
          if (created < startDate || created > endDate) return false;
        }
        return true;
      });
    }

    function validateSubscriberForm(form, resourceTypeId, budgetId, barcodeTypeId, excludeIndex = null) {
      clearSubscriberFormErrors(form);
      let valid = true;
      const name = form.name.value.trim();
      const siteId = form.siteId.value;
      const remark = form.remark.value.trim();
      const types = MultiSelect.getValue(resourceTypeId);
      const budgets = MultiSelect.getValue(budgetId);
      const barcodeTypes = MultiSelect.getValue(barcodeTypeId);

      if (!siteId) {
        showSubscriberFormError(form, 'siteId', '请选择');
        valid = false;
      }

      if (!name) {
        showSubscriberFormError(form, 'name', '请输入');
        valid = false;
      } else if (name.length > 50) {
        showSubscriberFormError(form, 'name', '已超字符限制');
        valid = false;
      } else if (subscriberRows.some((row, index) => row.name === name && index !== excludeIndex)) {
        showSubscriberFormError(form, 'name', '已存在');
        valid = false;
      }

      if (!types.length) {
        MultiSelect.showError(resourceTypeId, '请选择');
        valid = false;
      }

      if (!budgets.length) {
        MultiSelect.showError(budgetId, '请选择');
        valid = false;
      }

      if (!barcodeTypes.length) {
        MultiSelect.showError(barcodeTypeId, '请选择');
        valid = false;
      }

      if (remark.length > 500) {
        showSubscriberFormError(form, 'remark', '已超字符限制');
        valid = false;
      }

      return valid;
    }

    /**
     * 重置新增表单
     */
    function resetSubscriberAddForm() {
      const form = document.getElementById('subscriber-add-form');
      if (!form) return;
      form.reset();
      clearSubscriberFormErrors(form);
      MultiSelect.reset(addResourceTypeId);
      MultiSelect.reset(addBudgetId);
      MultiSelect.reset(addBarcodeTypeId);
    }

    /**
     * 打开新增订户弹窗
     */
    function openSubscriberAddModal() {
      resetSubscriberAddForm();
      document.getElementById('subscriber-add-modal')?.classList.remove('hidden');
    }

    /**
     * 打开编辑订户弹窗
     * @param {number} rowIndex - 行索引
     */
    function openSubscriberEditModal(rowIndex) {
      const row = subscriberRows[rowIndex];
      const form = document.getElementById('subscriber-edit-form');
      if (!row || !form) return;

      clearSubscriberFormErrors(form);
      form.rowIndex.value = String(rowIndex);
      form.name.value = row.name;
      initSubscriberSiteSelect(form.siteId, row.siteId || '');
      form.remark.value = row.remark || '';
      MultiSelect.setValue(editResourceTypeId, row.types || []);
      MultiSelect.setValue(editBudgetId, row.budgets || []);
      MultiSelect.setValue(editBarcodeTypeId, row.barcodeTypes || []);
      document.getElementById('subscriber-edit-modal')?.classList.remove('hidden');
    }

    /**
     * 获取当前日期字符串
     * @returns {string}
     */
    function getTodayString() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${month}-${day}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSubscriberMultiSelects();
      initSubscriberSiteSelects();
      updateSubscriberSortIcon();
      renderSubscriberTable();

      const searchForm = document.getElementById('subscriber-search-form');
      searchForm?.addEventListener('submit', e => {
        e.preventDefault();
        searchSubscriberRows(searchForm);
      });

      document.getElementById('subscriber-search-reset')?.addEventListener('click', resetSubscriberSearch);

      const expandBtn = document.getElementById('subscriber-search-expand');
      const searchExtra = document.getElementById('subscriber-search-extra');
      if (expandBtn && searchExtra) {
        let expanded = false;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          searchExtra.classList.toggle('hidden', !expanded);
          const expandText = document.getElementById('subscriber-search-expand-text');
          if (expandText) expandText.textContent = expanded ? '收起' : '展开';
          expandBtn.querySelector('svg')?.classList.toggle('rotate-180', expanded);
        });
      }

      document.getElementById('subscriber-created-sort')?.addEventListener('click', () => {
        subscriberCreatedSort = subscriberCreatedSort === 'desc' ? 'asc' : 'desc';
        updateSubscriberSortIcon();
        renderSubscriberTable();
      });

      document.getElementById('subscriber-add-btn')?.addEventListener('click', openSubscriberAddModal);

      document.getElementById('subscriber-table-body')?.addEventListener('click', e => {
        const editBtn = e.target.closest('.subscriber-edit-btn');
        if (editBtn) {
          const rowIndex = Number(editBtn.dataset.rowIndex);
          if (!Number.isNaN(rowIndex)) openSubscriberEditModal(rowIndex);
          return;
        }

        const librarianBtn = e.target.closest('.subscriber-librarian-btn');
        if (librarianBtn?.dataset.subscriberName) {
          openSubscriberLibrarianModal(librarianBtn.dataset.subscriberName);
        }
      });

      const librarianSearchForm = document.getElementById('subscriber-librarian-search-form');
      librarianSearchForm?.addEventListener('submit', e => {
        e.preventDefault();
        searchSubscriberLibrarians(librarianSearchForm);
      });
      document.getElementById('subscriber-librarian-search-reset')
        ?.addEventListener('click', resetSubscriberLibrarianSearch);

      document.getElementById('subscriber-add-submit')?.addEventListener('click', () => {
        const form = document.getElementById('subscriber-add-form');
        if (!form || !validateSubscriberForm(form, addResourceTypeId, addBudgetId, addBarcodeTypeId)) return;

        const newRow = {
          name: form.name.value.trim(),
          siteId: form.siteId.value,
          types: MultiSelect.getValue(addResourceTypeId),
          budgets: MultiSelect.getValue(addBudgetId),
          barcodeTypes: MultiSelect.getValue(addBarcodeTypeId),
          status: 'active',
          created: getTodayString(),
          remark: form.remark.value.trim(),
          hasLibrarian: false
        };
        subscriberRows.unshift(newRow);
        const currentSearchForm = document.getElementById('subscriber-search-form');
        subscriberDisplayRows = currentSearchForm
          ? filterSubscriberRows(subscriberRows, currentSearchForm)
          : [...subscriberRows];

        renderSubscriberTable();
        document.getElementById('subscriber-add-modal')?.classList.add('hidden');
      });

      document.getElementById('subscriber-edit-submit')?.addEventListener('click', () => {
        const form = document.getElementById('subscriber-edit-form');
        const rowIndex = Number(form?.rowIndex.value);
        if (!form || Number.isNaN(rowIndex) || !subscriberRows[rowIndex]) return;
        if (!validateSubscriberForm(form, editResourceTypeId, editBudgetId, editBarcodeTypeId, rowIndex)) return;

        subscriberRows[rowIndex] = {
          ...subscriberRows[rowIndex],
          name: form.name.value.trim(),
          siteId: form.siteId.value,
          types: MultiSelect.getValue(editResourceTypeId),
          budgets: MultiSelect.getValue(editBudgetId),
          barcodeTypes: MultiSelect.getValue(editBarcodeTypeId),
          remark: form.remark.value.trim()
        };

        const currentSearchForm = document.getElementById('subscriber-search-form');
        subscriberDisplayRows = currentSearchForm
          ? filterSubscriberRows(subscriberRows, currentSearchForm)
          : [...subscriberRows];

        renderSubscriberTable();
        document.getElementById('subscriber-edit-modal')?.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
