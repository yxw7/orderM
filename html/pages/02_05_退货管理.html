<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退货管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="退货管理"
  data-active-page="02_05_退货管理.html"
  data-page-tabs='[{"label":"订单管理","page":"01_01_非连续出版物订单-订单列表.html"},{"label":"逐条收货","page":"02_02_逐条收货_纸质书.html"},{"label":"换货管理","page":"02_04_换货管理.html"},{"label":"退货管理","active":true}]'>

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4">
      <form id="return-search-form">
        <div class="grid grid-cols-4 gap-4 items-center">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap shrink-0">资源标识</label>
            <select class="border border-gray-300 rounded-l px-2 py-1.5 text-sm text-gray-700 border-r-0 focus:outline-none w-24">
              <option>资源标识</option>
              <option>ISBN</option>
              <option>ISRC</option>
              <option>题名</option>
            </select>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded-r px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500 -ml-px">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">供应商</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>教图</option>
              <option>湖北三新</option>
              <option>北京人天</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">发货单号</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2 justify-end">
            <button type="button" id="return-search-expand"
              class="flex items-center gap-1 text-sm text-sky-600 hover:text-sky-700 mr-2">
              展开
              <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <button type="submit"
              class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">检索</button>
            <button type="button" onclick="Common.resetForm('return-search-form')"
              class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
          </div>
        </div>
        <div id="return-search-extra" class="hidden grid grid-cols-4 gap-4 mt-3">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">馆址</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
              <option>全部</option>
              <option>华威桥馆</option>
              <option>大兴机场馆</option>
              <option>城市图书馆</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">退货原因</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">退货批次</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">退货时间</label>
            <input type="date" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4">
      <div class="relative">
        <button type="button" data-dropdown
          class="flex items-center gap-1 px-4 py-1.5 bg-amber-500 text-white text-sm rounded hover:bg-amber-600">
          导出清单
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div data-dropdown-menu class="hidden absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10 min-w-[120px]">
          <a href="02_05_02_导出配置.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">导出配置</a>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">导出清单</a>
        </div>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200">
      <div class="overflow-x-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">资源类型</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">馆址</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">资源标识</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[120px]">题名</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">作者</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">出版社</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">订单行号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">定价</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">币种</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实洋</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">套内册数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">退货套数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[100px]">原因&备注</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                <span class="inline-flex items-center gap-1">
                  退货时间
                  <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>
                </span>
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">退货批次</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">供应商</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">发货单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap sticky right-0 bg-gray-50">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <tr class="hover:bg-gray-50">
              <td class="px-3 py-2 text-gray-600">1</td>
              <td class="px-3 py-2">视听资料</td>
              <td class="px-3 py-2">华威桥馆</td>
              <td class="px-3 py-2 whitespace-nowrap">CD-1102;017685110221</td>
              <td class="px-3 py-2 max-w-[140px]">国家大剧院经典剧目</td>
              <td class="px-3 py-2 text-gray-400">—</td>
              <td class="px-3 py-2">国家大剧院</td>
              <td class="px-3 py-2 whitespace-nowrap">
                <a href="01_01_02_订单行详情_纸质书.html" class="text-sky-600 hover:underline">PG00120260522005-1</a>
              </td>
              <td class="px-3 py-2">128.0</td>
              <td class="px-3 py-2">CNY</td>
              <td class="px-3 py-2">102.4</td>
              <td class="px-3 py-2">1</td>
              <td class="px-3 py-2">1</td>
              <td class="px-3 py-2 text-xs leading-relaxed">
                <div>原因：断品</div>
                <div class="text-gray-500">备注：</div>
              </td>
              <td class="px-3 py-2 whitespace-nowrap">2026-05-22 10:30:15</td>
              <td class="px-3 py-2 whitespace-nowrap">
                <a href="02_03_04_验收详情.html" class="text-sky-600 hover:underline">thPG00120260522005</a>
              </td>
              <td class="px-3 py-2">湖北三新</td>
              <td class="px-3 py-2 whitespace-nowrap">ST001820260522005-1</td>
              <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">
                <a href="02_05_01_撤销退货.html" class="text-sky-600 hover:underline">撤销退货</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
        <span class="text-sm text-gray-500">共 1 条</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option>10 条/页</option>
            <option>20 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const expandBtn = document.getElementById('return-search-expand');
      const extra = document.getElementById('return-search-extra');
      if (!expandBtn || !extra) return;
      let expanded = false;
      expandBtn.addEventListener('click', () => {
        expanded = !expanded;
        extra.classList.toggle('hidden', !expanded);
        expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
        expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
      });
    });
  </script>
</body>
</html>
