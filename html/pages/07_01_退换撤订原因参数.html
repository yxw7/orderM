<body class="h-screen flex flex-col overflow-hidden"

            <span id="return-reason-count" class="text-sm text-gray-500">共 2 条记录</span>
            <div class="flex items-center gap-3">

        </div>

              <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
                <tr>
                  <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap w-14">序号</th>
                  <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">原因内容</th>

      ],
      revokeReceive: [
        { content: '录入错误', status: 'active', sort: 1, creator: '赵付', created: '2026-05-22 09:10:12' },
        { content: '重复收货', status: 'active', sort: 2, creator: '杨晓婉', created: '2026-05-22 09:11:05' },
        { content: '品相差', status: 'active', sort: 3, creator: '王二小', created: '2026-05-22 09:12:18' }
      ]
    };

    if (!localStorage.getItem(ReasonParamsStore.STORAGE_KEY)) {
      ReasonParamsStore.saveAll(reasonTabData);
    }

    /** @type {Record<string, Object[]>} */
    let currentReasonData = {};
    /** @type {boolean} */
    let isReasonEditMode = false;

    /** @type {Record<string, string>} */
    const reasonTypeLabels = {
      exchange: '换货原因',
      return: '退货原因',
      cancel: '撤订原因',
      revokeReceive: '撤销收货原因'
    };

    /** @type {string[]} */
    const reasonTabKeys = Object.keys(reasonTypeLabels);

    /**
     * 加载全部原因数据
     * @returns {Record<string, Object[]>}
     */
    function loadAllReasonData() {
      const data = {};
      reasonTabKeys.forEach(key => {
        data[key] = ReasonParamsStore.getReasons(key).map(item => ({
          ...item,
          remark: item.remark ?? '',
          creator: item.creator || '赵付',
          created: item.created || formatReasonDateTime(new Date())
        }));
      });
      return data;
    }

    /**
     * 格式化日期时间
     * @param {Date} date - 日期对象
     * @returns {string}
     */
    function formatReasonDateTime(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} `
        + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    /**
     * 持久化原因数据
     */
    function persistReasonData() {
      ReasonParamsStore.saveAll(currentReasonData);
    }

    /**
     * 更新原因状态开关样式
     * @param {boolean} enabled - 是否启用
     */
    function updateReasonStatusToggle(enabled) {
      const track = document.getElementById('reason-status-track');
      const thumb = document.getElementById('reason-status-thumb');
      const label = document.getElementById('reason-status-label');
      if (track) {
        track.classList.toggle('bg-sky-600', enabled);
        track.classList.toggle('bg-gray-200', !enabled);
      }
      if (thumb) thumb.style.left = enabled ? '22px' : '2px';
      if (label) label.textContent = enabled ? '启用' : '停用';
    }

    /**
     * 清除原因表单校验提示
     */
    function clearReasonFormErrors() {
      document.querySelectorAll('#reason-form [data-error]').forEach(el => {
        el.classList.add('hidden');
      });
    }

    /**
     * 校验原因表单
     * @param {HTMLFormElement} form - 表单元素
     * @returns {boolean}
     */
    function validateReasonForm(form) {
      clearReasonFormErrors();
      const content = form.content.value.trim();
      if (!content) {
        form.querySelector('[data-error="content"]')?.classList.remove('hidden');
        return false;
      }
      return true;
    }

    /**
     * 重置新增原因表单
     * @param {string} tabKey - Tab 标识
     */
    function resetAddReasonForm(tabKey) {
      isReasonEditMode = false;
      const form = document.getElementById('reason-form');
      const title = document.getElementById('reason-form-modal-title');
      const submitBtn = document.getElementById('reason-form-submit');
      const label = reasonTypeLabels[tabKey] || '原因';
      if (!form) return;

      form.reset();
      form.reasonType.value = tabKey;
      form.editIndex.value = '';
      form.sort.value = '1';
      if (title) title.textContent = `新增${label}`;
      if (submitBtn) submitBtn.textContent = '提交';

      clearReasonFormErrors();
      const toggle = document.getElementById('reason-status-toggle');
      if (toggle) {
        toggle.checked = true;
        updateReasonStatusToggle(true);
      }
    }

    /**
     * 打开新增原因弹窗
     * @param {string} tabKey - Tab 标识
     */
    function openAddReasonModal(tabKey) {
      resetAddReasonForm(tabKey);
      document.getElementById('reason-form-modal')?.classList.remove('hidden');
    }

    /**
     * 打开编辑原因弹窗
     * @param {string} tabKey - Tab 标识
     * @param {number} index - 行索引
     */
    function openEditReasonModal(tabKey, index) {
      const row = currentReasonData[tabKey]?.[index];
      if (!row) return;

      isReasonEditMode = true;
      const form = document.getElementById('reason-form');
      const title = document.getElementById('reason-form-modal-title');
      const submitBtn = document.getElementById('reason-form-submit');
      const label = reasonTypeLabels[tabKey] || '原因';
      if (!form) return;

      clearReasonFormErrors();
      if (title) title.textContent = `编辑${label}`;
      if (submitBtn) submitBtn.textContent = '保存';

      form.reasonType.value = tabKey;
      form.editIndex.value = String(index);
      form.content.value = row.content || '';
      form.sort.value = String(row.sort ?? 1);
      form.remark.value = row.remark || '';

      const statusEnabled = row.status === 'active';
      const toggle = document.getElementById('reason-status-toggle');
      if (toggle) {
        toggle.checked = statusEnabled;
        updateReasonStatusToggle(statusEnabled);
      }

      document.getElementById('reason-form-modal')?.classList.remove('hidden');
    }

    /**
     * 关闭原因表单弹窗
     */
    function closeReasonFormModal() {
      document.getElementById('reason-form-modal')?.classList.add('hidden');
      clearReasonFormErrors();
    }

    /**
     * 提交原因表单
     */
    function submitReasonForm() {
      const form = document.getElementById('reason-form');
      if (!form || !validateReasonForm(form)) return;

      const tabKey = form.reasonType.value;
      if (!tabKey || !currentReasonData[tabKey]) return;

      const statusEnabled = document.getElementById('reason-status-toggle')?.checked ?? true;
      const sortValue = Number.parseInt(form.sort.value, 10);
      const payload = {
        content: form.content.value.trim(),
        status: statusEnabled ? 'active' : 'inactive',
        sort: Number.isNaN(sortValue) ? 1 : sortValue,
        remark: form.remark.value.trim()
      };

      if (isReasonEditMode && form.editIndex.value !== '') {
        const index = Number.parseInt(form.editIndex.value, 10);
        const row = currentReasonData[tabKey][index];
        if (row) Object.assign(row, payload);
      } else {
        currentReasonData[tabKey].unshift({
          ...payload,
          creator: '赵付',
          created: formatReasonDateTime(new Date())
        });
      }

      persistReasonData();
      renderReasonTable(tabKey);
      closeReasonFormModal();
    }

    /**
     * 渲染指定 Tab 原因表格
     * @param {string} tabKey - Tab 标识
     */
    function renderReasonTable(tabKey) {
      const rows = currentReasonData[tabKey] || [];
      const tbody = document.getElementById(`reason-table-${tabKey}`);
      if (tbody) {
        tbody.innerHTML = rows.map((row, i) => renderReasonRow(row, i + 1, tabKey, i)).join('');
      }
      const countEl = document.getElementById(`${tabKey}-reason-count`);
      if (countEl) countEl.textContent = `共 ${rows.length} 条记录`;
    }

    /**
     * 渲染全部原因表格
     */
    function renderAllReasonTables() {
      reasonTabKeys.forEach(tabKey => renderReasonTable(tabKey));
    }

    /**
     * 渲染原因状态
     * @param {string} status - 状态标识
     * @returns {string}
     */
    function renderReasonStatus(status) {
      if (status === 'active') {
        return '<span class="text-green-600">使用中</span>';
      }
      return '<span class="text-red-500">已停用</span>';
    }

    /**
     * 渲染操作列
     * @param {Object} row - 行数据
     * @param {string} tabKey - Tab 标识
     * @param {number} index - 行索引
     * @returns {string}
     */
    function renderReasonOps(row, tabKey, index) {
      const editAction = `<button type="button" class="text-sky-600 hover:underline mr-3" data-reason-edit data-reason-tab="${tabKey}" data-row-index="${index}">编辑</button>`;

      if (row.status === 'active') {
        return `
          ${editAction}
          <a href="07_01_03_停用_删除原因.html" class="text-sky-600 hover:underline">停用</a>`;
      }
      return `
        ${editAction}
        <a href="07_01_03_停用_删除原因.html" class="text-sky-600 hover:underline mr-3">启用</a>
        <a href="07_01_03_停用_删除原因.html" class="text-sky-600 hover:underline">删除</a>`;
    }

    /**
     * 渲染排序按钮列
     * @returns {string}
     */
    function renderSortButtons() {
      return `
        <td class="px-2 py-2 sticky right-0 bg-white">
          <div class="flex flex-col items-center gap-0.5">
            <button type="button" class="text-gray-400 hover:text-sky-600 leading-none" title="上移">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
              </svg>
            </button>
            <button type="button" class="text-gray-400 hover:text-sky-600 leading-none" title="下移">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
          </div>
        </td>`;
    }

    /**
     * 渲染原因表格行
     * @param {Object} row - 行数据
     * @param {number} index - 行序号
     * @param {string} tabKey - Tab 标识
     * @param {number} rowIndex - 行索引
     * @returns {string}
     */
    function renderReasonRow(row, index, tabKey, rowIndex) {
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${index}</td>
          <td class="px-3 py-2">
            <a href="07_01_04_查看.html" class="text-sky-600 hover:underline">${row.content}</a>
          </td>
          <td class="px-3 py-2">${renderReasonStatus(row.status)}</td>
          <td class="px-3 py-2">${row.sort}</td>
          <td class="px-3 py-2">${row.creator}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.created}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-8 bg-white">${renderReasonOps(row, tabKey, rowIndex)}</td>
          ${renderSortButtons()}
        </tr>`;
    }

    /**
     * 切换原因参数 Tab
     * @param {string} tabKey - Tab 标识
     */
    function switchReasonTab(tabKey) {
      document.querySelectorAll('[data-reason-tab]').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.reasonTab === tabKey);
      });
      document.querySelectorAll('[data-reason-panel]').forEach(panel => {
        const isActive = panel.dataset.reasonPanel === tabKey;
        panel.classList.toggle('hidden', !isActive);
        panel.classList.toggle('flex', isActive);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      currentReasonData = loadAllReasonData();
      renderAllReasonTables();

      document.getElementById('reason-params-page')?.addEventListener('click', event => {
        const addBtn = event.target.closest('[data-reason-add]');
        if (addBtn) {
          openAddReasonModal(addBtn.dataset.reasonAdd);
          return;
        }
        const editBtn = event.target.closest('[data-reason-edit]');
        if (editBtn) {
          const tabKey = editBtn.dataset.reasonTab;
          const index = Number.parseInt(editBtn.dataset.rowIndex, 10);
          if (tabKey && !Number.isNaN(index)) openEditReasonModal(tabKey, index);
        }
      });

      document.getElementById('reason-form-modal-close')?.addEventListener('click', closeReasonFormModal);
      document.getElementById('reason-form-cancel')?.addEventListener('click', closeReasonFormModal);
      document.getElementById('reason-form-submit')?.addEventListener('click', submitReasonForm);

      const reasonStatusToggle = document.getElementById('reason-status-toggle');
      if (reasonStatusToggle) {
        reasonStatusToggle.addEventListener('change', () => {
          updateReasonStatusToggle(reasonStatusToggle.checked);
        });
      }

      document.querySelectorAll('[data-reason-tab]').forEach(tab => {
        tab.addEventListener('click', () => switchReasonTab(tab.dataset.reasonTab));
      });

      const expandBtn = document.getElementById('reason-search-expand');
      const extra = document.getElementById('reason-search-extra');
      if (expandBtn && extra) {
        let expanded = true;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          extra.classList.toggle('hidden', !expanded);
          expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
          expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
        });
      }
    });
  </script>
</body>
</html>
