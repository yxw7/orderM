<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单行详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="订单行详情"
  data-active-page="01_01_非连续出版物订单-订单列表.html">

  <div id="app-root" class="flex flex-col h-full"></div>
  <div id="main-content" class="hidden flex-1 overflow-y-auto p-4 space-y-4">

    <!-- 异常提示 -->
    <div id="order-line-alerts" class="hidden space-y-2"></div>

    <!-- 管理驾驶舱 -->
    <div id="order-line-cockpit" class="bg-white rounded border border-gray-200 p-5"></div>

    <!-- 书目信息（默认收起） -->
    <div class="bg-white rounded border border-gray-200">
      <button type="button" id="order-line-bib-toggle"
        class="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-gray-50 transition-colors">
        <h3 class="text-sm font-medium text-gray-800">书目信息</h3>
        <span id="order-line-bib-toggle-text" class="text-sm text-sky-600">展开</span>
      </button>
      <div id="order-line-bib-panel" class="hidden border-t border-gray-200 p-5">
        <div class="flex gap-6">
          <div class="shrink-0 flex flex-col items-center gap-2 pt-1">
            <div id="order-line-detail-cover"></div>
            <p id="order-line-detail-resource-type" class="text-xs text-gray-500 text-center leading-5">资源类型：纸质书</p>
          </div>
          <div class="flex-1 min-w-0">
            <h2 id="order-line-detail-title" class="text-base font-bold text-gray-900 mb-5">—</h2>
            <div id="order-line-detail-fields" class="grid grid-cols-3 gap-x-10 gap-y-1"></div>
            <div id="order-line-detail-full-fields" class="mt-4 space-y-3"></div>
            <div id="order-line-detail-extra" class="hidden mt-3 space-y-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 业务 Tab 区 -->
    <div class="bg-white rounded border border-gray-200">
      <div id="order-line-detail-tabs" class="flex flex-wrap gap-1 px-4 pt-3 border-b border-gray-200"></div>
      <div class="p-4">
        <div id="order-line-tab-lifecycle"></div>
        <div id="order-line-tab-acceptance" class="hidden"></div>
        <div id="order-line-tab-items" class="hidden"></div>
        <div id="order-line-tab-settlement" class="hidden"></div>
        <div id="order-line-tab-related" class="hidden"></div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/order-line-detail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OrderLineDetail.initBook();
    });
  </script>
</body>
</html>
