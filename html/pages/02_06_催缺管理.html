<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>催缺管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="催缺管理"
  data-active-page="02_06_催缺管理.html">

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4">
      <form id="shortage-search-form">
        <div class="grid grid-cols-4 gap-4 items-center">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">催缺单号</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">订单号</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">供应商</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>湖南长沙</option>
              <option>湖北三新</option>
              <option>教图</option>
            </select>
          </div>
          <div class="flex items-center gap-2 justify-end">
            <button type="button" id="shortage-search-expand"
              class="flex items-center gap-1 text-sm text-sky-600 hover:text-sky-700 mr-2">
              展开
              <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>
            <button type="submit"
              class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">查询</button>
            <button type="button" onclick="Common.resetForm('shortage-search-form')"
              class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
          </div>
        </div>
        <div id="shortage-search-extra" class="hidden grid grid-cols-4 gap-4 mt-3">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">催缺状态</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
              <option>全部</option>
              <option>待处理</option>
              <option>处理中</option>
              <option>已完成</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">催缺人</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">馆址</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
              <option>全部</option>
              <option>华威桥馆</option>
              <option>大兴机场馆</option>
              <option>城市图书馆</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">催缺时间</label>
            <input type="date" class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm">
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4">
      <button type="button" id="shortage-cancel-order-btn" disabled
        class="px-4 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400 disabled:bg-gray-50 disabled:cursor-not-allowed disabled:hover:bg-gray-50">撤订</button>
      <button type="button" id="shortage-change-supplier-btn" disabled
        class="px-4 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50 disabled:border-gray-200 disabled:text-gray-400 disabled:bg-gray-50 disabled:cursor-not-allowed disabled:hover:bg-gray-50">更换供应商</button>
      <div class="relative">
        <button type="button" data-dropdown
          class="flex items-center gap-1 px-4 py-1.5 bg-amber-500 text-white text-sm rounded hover:bg-amber-600">
          批量导出
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div data-dropdown-menu class="hidden absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-10 min-w-[120px]">
          <a href="02_06_04_导出配置.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">导出配置</a>
          <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">导出清单</a>
        </div>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200" data-list-selection-root="shortage-list">
      <div class="overflow-x-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2.5 text-left w-10">
                <input type="checkbox" id="shortage-select-all" class="rounded">
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">催缺单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">订单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">资源类型</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">供应商</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">馆址</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">预算名称</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">催缺人</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                <span class="inline-flex items-center gap-1">
                  催缺时间
                  <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>
                </span>
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">催缺状态</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">催缺套数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">到货套数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">备注</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap sticky right-0 bg-gray-50">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100" id="shortage-table-body"></tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
        <span id="shortage-list-total" class="text-sm text-gray-500" data-list-selection-total
          data-list-selection-root="shortage-list" data-list-selection-checkbox=".shortage-row-checkbox"
          data-list-selection-unit="条">共 7 条</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option>20 条/页</option>
            <option>10 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 撤订原因弹窗 -->
  <div id="shortage-cancel-order-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md flex flex-col"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">请选择撤订原因</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="shortage-cancel-order-form" class="px-6 py-5">
        <select name="cancelReason"
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
          <option value="">请选择撤订原因</option>
          <option value="撤订">撤订</option>
          <option value="退订">退订</option>
        </select>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="shortage-cancel-order-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">确认撤订</button>
      </div>
    </div>
  </div>

  <!-- 更换供应商弹窗 -->
  <div id="shortage-change-supplier-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">更换供应商</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="shortage-change-supplier-form" class="px-6 py-5 space-y-4">
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-24 text-right shrink-0">
            <span class="text-red-500">*</span> 供应商
          </label>
          <select name="supplier"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
            <option value="">请选择</option>
            <option value="湖南长沙">湖南长沙</option>
            <option value="湖北三新">湖北三新</option>
            <option value="教图">教图</option>
            <option value="北京市图书进出口有限公司">北京市图书进出口有限公司</option>
          </select>
        </div>
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-24 text-right shrink-0">
            <span class="text-red-500">*</span> 预算名称
          </label>
          <select name="budget"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
            <option value="">请选择</option>
            <option value="集团2020年度预算">集团2020年度预算</option>
            <option value="集团2021年度预算">集团2021年度预算</option>
          </select>
        </div>
        <div class="flex items-start gap-3">
          <label class="text-sm text-gray-600 w-24 text-right pt-2 shrink-0">备注</label>
          <textarea name="remark" rows="4" placeholder="请输入备注"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-sky-500 resize-y"></textarea>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="shortage-change-supplier-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">生成新订单</button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 催缺管理示例数据 */
    const shortageRows = [
      { no: 1, shortageId: 'cqPG00120200301001', orderId: 'PG001020200328008', type: '纸质书', supplier: '湖南长沙', location: '华威桥馆', budget: '集团2020年度预算', person: '系统', time: '2020-06-01 10:28:20', status: 'pending', sets: 2, arrived: 0, remark: false, actions: true },
      { no: 2, shortageId: 'cqPG00120200301002', orderId: 'PG001020200328009', type: '纸质书', supplier: '湖北三新', location: '大兴机场馆', budget: '集团2020年度预算', person: '李佳', time: '2020-06-02 14:15:30', status: 'done', sets: 1, arrived: 1, remark: true, actions: false },
      { no: 3, shortageId: 'cqPG00120200301003', orderId: 'PG001020200328010', type: '纸质书', supplier: '湖南长沙', location: '华威桥馆', budget: '集团2020年度预算', person: '系统', time: '2020-06-03 09:10:05', status: 'done', sets: 3, arrived: 0, remark: false, actions: false },
      { no: 4, shortageId: 'cqPG00120200301004', orderId: 'PG001020200328011', type: '纸质书', supplier: '教图', location: '城市图书馆', budget: '集团2020年度预算', person: '黄俊', time: '2020-06-04 16:42:18', status: 'pending', sets: 1, arrived: 0, remark: false, actions: true },
      { no: 5, shortageId: 'cqPG00120200301005', orderId: 'PG001020200328012', type: '纸质书', supplier: '湖北三新', location: '华威桥馆', budget: '集团2021年度预算', person: '系统', time: '2020-06-05 11:05:55', status: 'done', sets: 2, arrived: 0, remark: true, actions: false },
      { no: 6, shortageId: 'cqPG00120200301006', orderId: 'PG001020200328013', type: '纸质书', supplier: '湖南长沙', location: '大兴机场馆', budget: '集团2020年度预算', person: '陆丰', time: '2020-06-06 08:30:00', status: 'pending', sets: 4, arrived: 0, remark: false, actions: true },
      { no: 7, shortageId: 'cqPG00120200301007', orderId: 'PG001020200328014', type: '纸质书', supplier: '教图', location: '华威桥馆', budget: '集团2020年度预算', person: '系统', time: '2020-06-07 17:20:40', status: 'done', sets: 1, arrived: 0, remark: false, actions: false }
    ];

    /**
     * 渲染催缺状态标签
     * @param {string} status - 状态标识
     * @returns {string}
     */
    function renderStatus(status) {
      if (status === 'pending') {
        return '<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600 border border-gray-200">待处理</span>';
      }
      return '<span class="inline-block px-2 py-0.5 rounded text-xs bg-gray-200 text-gray-700">已完成</span>';
    }

    /**
     * 渲染表格行
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderRow(row) {
      const ops = row.actions
        ? `<a href="#" class="text-sky-600 hover:underline mr-3 shortage-row-cancel-order-btn" data-row-no="${row.no}">撤订</a>
           <a href="#" class="text-sky-600 hover:underline shortage-row-change-supplier-btn" data-row-no="${row.no}">更换供应商</a>`
        : '<span class="text-gray-400">—</span>';
      const remark = row.remark
        ? '<a href="#" class="text-sky-600 hover:underline">查看</a>'
        : '';
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2">
            <input type="checkbox" class="rounded shortage-row-checkbox" data-row-no="${row.no}">
          </td>
          <td class="px-3 py-2 text-gray-600">${row.no}</td>
          <td class="px-3 py-2 whitespace-nowrap">
            <a href="02_06_01_催缺详情.html" class="text-sky-600 hover:underline">${row.shortageId}</a>
          </td>
          <td class="px-3 py-2 whitespace-nowrap">
            <a href="01_01_13_编辑订单.html" class="text-sky-600 hover:underline">${row.orderId}</a>
          </td>
          <td class="px-3 py-2">${row.type}</td>
          <td class="px-3 py-2">${row.supplier}</td>
          <td class="px-3 py-2">${row.location}</td>
          <td class="px-3 py-2">${row.budget}</td>
          <td class="px-3 py-2">${row.person}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.time}</td>
          <td class="px-3 py-2">${renderStatus(row.status)}</td>
          <td class="px-3 py-2">${row.sets}</td>
          <td class="px-3 py-2">${row.arrived}</td>
          <td class="px-3 py-2">${remark}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">${ops}</td>
        </tr>`;
    }

    /**
     * 获取已勾选的催缺行号列表
     * @returns {number[]}
     */
    function getCheckedShortageRowNos() {
      return Array.from(document.querySelectorAll('.shortage-row-checkbox:checked'))
        .map(el => Number(el.dataset.rowNo))
        .filter(no => !Number.isNaN(no));
    }

    /**
     * 同步表头全选复选框状态
     */
    function syncShortageSelectAllState() {
      const selectAll = document.getElementById('shortage-select-all');
      const rowChecks = document.querySelectorAll('.shortage-row-checkbox');
      if (!selectAll || !rowChecks.length) return;
      const checkedCount = document.querySelectorAll('.shortage-row-checkbox:checked').length;
      selectAll.checked = checkedCount > 0 && checkedCount === rowChecks.length;
      selectAll.indeterminate = checkedCount > 0 && checkedCount < rowChecks.length;
    }

    /**
     * 根据勾选状态更新顶部操作按钮
     */
    function updateShortageToolbarState() {
      const hasChecked = getCheckedShortageRowNos().length > 0;
      const cancelOrderBtn = document.getElementById('shortage-cancel-order-btn');
      const changeSupplierBtn = document.getElementById('shortage-change-supplier-btn');
      if (cancelOrderBtn) cancelOrderBtn.disabled = !hasChecked;
      if (changeSupplierBtn) changeSupplierBtn.disabled = !hasChecked;
    }

    /**
     * 打开撤订原因弹窗
     */
    function openShortageCancelOrderModal() {
      const form = document.getElementById('shortage-cancel-order-form');
      const modal = document.getElementById('shortage-cancel-order-modal');
      if (!form || !modal) return;
      form.reset();
      modal.classList.remove('hidden');
    }

    /**
     * 打开更换供应商弹窗
     */
    function openShortageChangeSupplierModal() {
      const form = document.getElementById('shortage-change-supplier-form');
      const modal = document.getElementById('shortage-change-supplier-modal');
      if (!form || !modal) return;
      form.reset();
      modal.classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('shortage-table-body');
      if (tbody) {
        tbody.innerHTML = shortageRows.map(renderRow).join('');
        ListSelectionSummary.refresh('shortage-list-total', { totalCount: shortageRows.length });
        tbody.addEventListener('change', e => {
          if (e.target.classList.contains('shortage-row-checkbox')) {
            syncShortageSelectAllState();
            updateShortageToolbarState();
          }
        });
        tbody.addEventListener('click', e => {
          const cancelOrderBtn = e.target.closest('.shortage-row-cancel-order-btn');
          if (cancelOrderBtn) {
            e.preventDefault();
            openShortageCancelOrderModal();
            return;
          }
          const changeSupplierBtn = e.target.closest('.shortage-row-change-supplier-btn');
          if (changeSupplierBtn) {
            e.preventDefault();
            openShortageChangeSupplierModal();
          }
        });
      }

      const selectAll = document.getElementById('shortage-select-all');
      if (selectAll) {
        selectAll.addEventListener('change', () => {
          document.querySelectorAll('.shortage-row-checkbox').forEach(cb => {
            cb.checked = selectAll.checked;
          });
          selectAll.indeterminate = false;
          updateShortageToolbarState();
        });
      }

      document.getElementById('shortage-cancel-order-btn')?.addEventListener('click', () => {
        if (!getCheckedShortageRowNos().length) {
          alert('请先勾选催缺数据');
          return;
        }
        openShortageCancelOrderModal();
      });

      document.getElementById('shortage-change-supplier-btn')?.addEventListener('click', () => {
        if (!getCheckedShortageRowNos().length) {
          alert('请先勾选催缺数据');
          return;
        }
        openShortageChangeSupplierModal();
      });

      const cancelOrderModal = document.getElementById('shortage-cancel-order-modal');
      document.getElementById('shortage-cancel-order-submit')?.addEventListener('click', () => {
        const form = document.getElementById('shortage-cancel-order-form');
        if (!form) return;
        if (!form.elements.cancelReason.value) {
          alert('请选择撤订原因');
          return;
        }
        if (cancelOrderModal) cancelOrderModal.classList.add('hidden');
      });

      const changeSupplierModal = document.getElementById('shortage-change-supplier-modal');
      document.getElementById('shortage-change-supplier-submit')?.addEventListener('click', () => {
        const form = document.getElementById('shortage-change-supplier-form');
        if (!form) return;
        if (!form.elements.supplier.value) {
          alert('请选择供应商');
          return;
        }
        if (!form.elements.budget.value) {
          alert('请选择预算名称');
          return;
        }
        if (changeSupplierModal) changeSupplierModal.classList.add('hidden');
      });

      const expandBtn = document.getElementById('shortage-search-expand');
      const extra = document.getElementById('shortage-search-extra');
      if (expandBtn && extra) {
        let expanded = false;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          extra.classList.toggle('hidden', !expanded);
          expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
          expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
        });
      }

      updateShortageToolbarState();
    });
  </script>
</body>
</html>
