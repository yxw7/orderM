            <label class="text-sm text-gray-600 w-28 text-right pt-2 shrink-0">

          <button type="button" id="barcode-supplier-edit-submit"
            class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">提交</button>

      { barcodeType: '中文港台图书', supplierCode: 'CNPIEC', supplierName: '教图', barcodeCode: '02', status: 'active', hasRemark: false, remark: '', creator: '杨晓婉', created: '2024-05-23' },
      { barcodeType: '成人视听', supplierCode: 'bjxh', supplierName: '北京新华', barcodeCode: '03', status: 'active', hasRemark: true, remark: '北京新华图书', creator: '杨晓婉', created: '2024-05-22' },
      { barcodeType: '少儿视听', supplierCode: 'zgjd', supplierName: '中国嘉德', barcodeCode: '05', status: 'active', hasRemark: true, remark: '中国嘉德国际拍卖', creator: '杨晓婉', created: '2024-05-21' },
      { barcodeType: '中文成人普通', supplierCode: 'bjtsds', supplierName: '北京图书大厦', barcodeCode: '07', status: 'active', hasRemark: false, remark: '', creator: '杨晓婉', created: '2024-05-20' }
    ];

    /**
     * 渲染状态
     * @param {string} status - 状态标识
     * @returns {string}
     */
    function renderBarcodeStatus(status) {
      if (status === 'active') {
        return '<span class="text-green-600">使用中</span>';
      }
      return '<span class="text-red-500">已停用</span>';
    }

    /**
     * 渲染备注列
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderRemarkCell(row) {
      if (row.hasRemark) {
        return `<a href="#" class="text-sky-600 hover:underline" title="${row.remark}">查看</a>`;
      }
      return '<span class="text-gray-400">查看</span>';
    }

    /**
     * 渲染操作列
     * @param {Object} row - 行数据
     * @param {number} rowIndex - 行索引（0-based）
     * @returns {string}
     */
    function renderBarcodeOps(row, rowIndex) {
      const editBtn = `<button type="button" class="text-sky-600 hover:underline mr-3 barcode-supplier-edit-btn" data-row-index="${rowIndex}">编辑</button>`;
      if (row.status === 'active') {
        return `
          ${editBtn}
          <a href="07_03_03_停用_删除.html" class="text-sky-600 hover:underline mr-3">停用</a>
          <a href="07_03_03_停用_删除.html" class="text-red-500 hover:underline">删除</a>`;
      }
      return `
        ${editBtn}
        <a href="07_03_03_停用_删除.html" class="text-sky-600 hover:underline mr-3">启用</a>
        <a href="07_03_03_停用_删除.html" class="text-red-500 hover:underline">删除</a>`;
    }

    /**
     * 渲染表格行
     * @param {Object} row - 行数据
     * @param {number} index - 显示序号
     * @param {number} rowIndex - 数据索引（0-based）
     * @returns {string}
     */
    function renderBarcodeSupplierRow(row, index, rowIndex) {
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${index}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.barcodeType}</td>
          <td class="px-3 py-2">${row.supplierCode}</td>
          <td class="px-3 py-2">${row.supplierName}</td>
          <td class="px-3 py-2">${row.barcodeCode}</td>
          <td class="px-3 py-2">${renderBarcodeStatus(row.status)}</td>
          <td class="px-3 py-2">${renderRemarkCell(row)}</td>
          <td class="px-3 py-2">${row.creator}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.created}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">${renderBarcodeOps(row, rowIndex)}</td>
        </tr>`;
    }

    /**
     * 刷新列表表格
     */
    function refreshBarcodeTable() {
      const tbody = document.getElementById('barcode-supplier-table-body');
      if (tbody) {
        tbody.innerHTML = barcodeSupplierRows
          .map((row, i) => renderBarcodeSupplierRow(row, i + 1, i))
          .join('');
      }
    }

    /**
     * 显示字段校验错误
     * @param {string} field - 字段名
     * @param {string} message - 错误提示
     * @param {boolean} [show=true] - 是否显示
     * @param {string} [formId='barcode-supplier-add-form'] - 表单 ID
     */
    function showFieldError(field, message, show = true, formId = 'barcode-supplier-add-form') {
      const el = document.querySelector(`#${formId} [data-error="${field}"]`);
      if (!el) return;
      el.textContent = message;
      el.classList.toggle('hidden', !show);
    }

    /**
     * 清除表单全部校验提示
     * @param {string} formId - 表单 ID
     */
    function clearFormErrors(formId) {
      document.querySelectorAll(`#${formId} [data-error]`).forEach(el => {
        el.classList.add('hidden');
      });
    }

    /**
     * 清除新增表单全部校验提示
     */
    function clearAddFormErrors() {
      clearFormErrors('barcode-supplier-add-form');
    }

    /**
     * 清除编辑表单全部校验提示
     */
    function clearEditFormErrors() {
      clearFormErrors('barcode-supplier-edit-form');
    }

    /**
     * 显示提交结果提示
     * @param {boolean} success - 是否成功
     * @param {string} [message] - 自定义提示文案
     */
    function showBarcodeToast(success, message) {
      const toast = document.getElementById('barcode-supplier-toast');
      const inner = document.getElementById('barcode-supplier-toast-inner');
      const text = document.getElementById('barcode-supplier-toast-text');
      const icon = document.getElementById('barcode-supplier-toast-icon');
      if (!toast || !inner || !text || !icon) return;

      text.textContent = message || (success ? '提交成功' : '提交失败');
      inner.className = success
        ? 'flex items-center gap-2 px-4 py-2.5 rounded shadow-lg text-sm text-white bg-green-500'
        : 'flex items-center gap-2 px-4 py-2.5 rounded shadow-lg text-sm text-white bg-red-500';
      icon.innerHTML = success
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>';

      toast.classList.remove('hidden');
      clearTimeout(showBarcodeToast._timer);
      showBarcodeToast._timer = setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    /**
     * 解析条码号代码为数组（英文分号分隔）
     * @param {string} raw - 原始输入
     * @returns {string[]}
     */
    function parseBarcodeCodes(raw) {
      return raw.split(';').map(s => s.trim()).filter(Boolean);
    }

    /**
     * 校验条码号代码格式（每位为2位数字）
     * @param {string[]} codes - 代码数组
     * @returns {boolean}
     */
    function isValidBarcodeCodeFormat(codes) {
      return codes.length > 0 && codes.every(code => /^\d{2}$/.test(code));
    }

    /**
     * 校验输入中是否存在重复代码
     * @param {string[]} codes - 代码数组
     * @returns {boolean}
     */
    function hasDuplicateInCodes(codes) {
      return new Set(codes).size !== codes.length;
    }

    /**
     * 校验条码号代码字段
     * @param {string} raw - 原始输入
     * @param {string} barcodeType - 条码号类型
     * @param {string} formId - 表单 ID
     * @param {number} [excludeIndex=-1] - 编辑时排除的行索引
     * @returns {boolean}
     */
    function validateBarcodeCodeField(raw, barcodeType, formId, excludeIndex = -1) {
      if (!raw) {
        showFieldError('barcodeCode', '请输入', true, formId);
        return false;
      }
      const codes = parseBarcodeCodes(raw);
      if (!isValidBarcodeCodeFormat(codes)) {
        showFieldError('barcodeCode', '每个代码须为2位数字，多个用英文分号;隔开', true, formId);
        return false;
      }
      if (hasDuplicateInCodes(codes)) {
        showFieldError('barcodeCode', '已存在（相同条码号类型的代码不能重复）', true, formId);
        return false;
      }
      if (barcodeType && hasDuplicateBarcodeCode(barcodeType, codes, excludeIndex)) {
        showFieldError('barcodeCode', '已存在（相同条码号类型的代码不能重复）', true, formId);
        return false;
      }
      return true;
    }

    /**
     * 校验同类型条码号代码是否重复
     * @param {string} barcodeType - 条码号类型
     * @param {string[]} codes - 待校验代码
     * @param {number} [excludeIndex=-1] - 编辑时排除的行索引
     * @returns {boolean}
     */
    function hasDuplicateBarcodeCode(barcodeType, codes, excludeIndex = -1) {
      const existing = barcodeSupplierRows
        .filter((row, i) => i !== excludeIndex && row.barcodeType === barcodeType)
        .map(row => row.barcodeCode);
      return codes.some(code => existing.includes(code));
    }

    /**
     * 更新状态开关视觉
     * @param {boolean} enabled - 是否开启
     * @param {'add'|'edit'} [mode='add'] - 表单模式
     */
    function updateStatusToggle(enabled, mode = 'add') {
      const prefix = mode === 'edit' ? 'barcode-supplier-edit-status' : 'barcode-supplier-status';
      const track = document.getElementById(`${prefix}-track`);
      const thumb = document.getElementById(`${prefix}-thumb`);
      const label = document.getElementById(`${prefix}-label`);
      if (track) track.classList.toggle('bg-sky-600', enabled);
      if (track) track.classList.toggle('bg-gray-200', !enabled);
      if (thumb) thumb.style.left = enabled ? '22px' : '2px';
      if (label) label.textContent = enabled ? '开启' : '关闭';
    }

    /**
     * 重置新增表单
     */
    function resetAddForm() {
      const form = document.getElementById('barcode-supplier-add-form');
      if (!form) return;
      form.reset();
      clearAddFormErrors();
      document.querySelectorAll('#barcode-supplier-add-form [data-search-select-input]').forEach(input => {
        input.value = '';
      });
      document.querySelectorAll('#barcode-supplier-add-form [data-search-select-value]').forEach(input => {
        input.value = '';
      });
      const statusToggle = document.getElementById('barcode-supplier-status-toggle');
      if (statusToggle) {
        statusToggle.checked = true;
        updateStatusToggle(true, 'add');
      }
    }

    /**
     * 初始化可搜索下拉框
     * @param {HTMLElement} container - 下拉容器
     * @param {Array<string|Object>} options - 选项列表
     * @param {(item: string|Object) => string} getLabel - 取显示文本
     * @param {(item: string|Object) => string} getValue - 取值
     */
    function initSearchSelect(container, options, getLabel, getValue) {
      const input = container.querySelector('[data-search-select-input]');
      const hidden = container.querySelector('[data-search-select-value]');
      const list = container.querySelector('[data-search-select-list]');
      if (!input || !hidden || !list) return;

      /**
       * 渲染下拉选项
       * @param {string} keyword - 检索关键字
       */
      function renderOptions(keyword = '') {
        const kw = keyword.trim().toLowerCase();
        const filtered = options.filter(item => getLabel(item).toLowerCase().includes(kw));
        list.innerHTML = filtered.length
          ? filtered.map(item => {
              const label = getLabel(item);
              const value = getValue(item);
              return `<li class="search-select-option px-3 py-2 text-sm text-gray-700 cursor-pointer" data-value="${value}">${label}</li>`;
            }).join('')
          : '<li class="px-3 py-2 text-sm text-gray-400">无匹配项</li>';
      }

      input.addEventListener('focus', () => {
        renderOptions(input.value);
        list.classList.remove('hidden');
      });

      input.addEventListener('input', () => {
        hidden.value = '';
        renderOptions(input.value);
        list.classList.remove('hidden');
        const field = container.dataset.searchSelect;
        const formId = container.closest('form')?.id;
        if (field && formId) showFieldError(field, '', false, formId);
      });

      list.addEventListener('click', e => {
        const option = e.target.closest('[data-value]');
        if (!option) return;
        input.value = option.textContent.trim();
        hidden.value = option.dataset.value;
        list.classList.add('hidden');
        const field = container.dataset.searchSelect;
        const formId = container.closest('form')?.id;
        if (field && formId) showFieldError(field, '', false, formId);
      });

      document.addEventListener('click', e => {
        if (!container.contains(e.target)) list.classList.add('hidden');
      });
    }

    /**
     * 校验并提交新增表单
     * @returns {boolean}
     */
    function submitAddForm() {
      clearAddFormErrors();
      const form = document.getElementById('barcode-supplier-add-form');
      if (!form) return false;

      const barcodeType = form.querySelector('[name="barcodeType"]').value.trim();
      const supplierName = form.querySelector('[name="supplierName"]').value.trim();
      const barcodeCodeRaw = form.querySelector('[name="barcodeCode"]').value.trim();
      const remark = form.querySelector('[name="remark"]').value;
      const statusEnabled = document.getElementById('barcode-supplier-status-toggle')?.checked ?? true;

      let valid = true;

      if (!barcodeType) {
        showFieldError('barcodeType', '请选择');
        valid = false;
      }
      if (!supplierName) {
        showFieldError('supplierName', '请选择');
        valid = false;
      }
      if (!validateBarcodeCodeField(barcodeCodeRaw, barcodeType, 'barcode-supplier-add-form')) {
        valid = false;
      }
      if (remark.length > 500) {
        showFieldError('remark', '已超字符限制');
        valid = false;
      }

      if (!valid) {
        showBarcodeToast(false, '提交失败');
        return false;
      }

      const supplier = supplierNameOptions.find(s => s.name === supplierName);
      const codes = parseBarcodeCodes(barcodeCodeRaw);
      codes.forEach(code => {
        barcodeSupplierRows.unshift({
          barcodeType,
          supplierCode: supplier?.code || '',
          supplierName,
          barcodeCode: code,
          status: statusEnabled ? 'active' : 'inactive',
          hasRemark: !!remark.trim(),
          remark: remark.trim(),
          creator: '杨晓婉',
          created: new Date().toISOString().slice(0, 10)
        });
      });

      refreshBarcodeTable();

      document.getElementById('barcode-supplier-add-modal')?.classList.add('hidden');
      resetAddForm();
      showBarcodeToast(true);
      return true;
    }

    /**
     * 打开编辑弹窗并带入原数据
     * @param {number} rowIndex - 行索引（0-based）
     */
    function openEditModal(rowIndex) {
      const row = barcodeSupplierRows[rowIndex];
      if (!row) return;

      const form = document.getElementById('barcode-supplier-edit-form');
      if (!form) return;

      clearEditFormErrors();
      form.querySelector('[name="rowIndex"]').value = String(rowIndex);
      form.querySelector('[name="barcodeType"]').value = row.barcodeType;
      form.querySelector('[name="supplierName"]').value = row.supplierName;
      form.querySelector('[name="barcodeCode"]').value = row.barcodeCode;
      form.querySelector('[name="remark"]').value = row.remark || '';

      const statusEnabled = row.status === 'active';
      const statusToggle = document.getElementById('barcode-supplier-edit-status-toggle');
      if (statusToggle) {
        statusToggle.checked = statusEnabled;
        updateStatusToggle(statusEnabled, 'edit');
      }

      document.getElementById('barcode-supplier-edit-modal')?.classList.remove('hidden');
    }

    /**
     * 校验并提交编辑表单
     * @returns {boolean}
     */
    function submitEditForm() {
      clearEditFormErrors();
      const form = document.getElementById('barcode-supplier-edit-form');
      if (!form) return false;

      const rowIndex = Number(form.querySelector('[name="rowIndex"]').value);
      const row = barcodeSupplierRows[rowIndex];
      if (!row) return false;

      const barcodeType = form.querySelector('[name="barcodeType"]').value.trim();
      const barcodeCodeRaw = form.querySelector('[name="barcodeCode"]').value.trim();
      const remark = form.querySelector('[name="remark"]').value;
      const statusEnabled = document.getElementById('barcode-supplier-edit-status-toggle')?.checked ?? true;

      let valid = true;

      if (!validateBarcodeCodeField(barcodeCodeRaw, barcodeType, 'barcode-supplier-edit-form', rowIndex)) {
        valid = false;
      }
      if (remark.length > 500) {
        showFieldError('remark', '已超字符限制', true, 'barcode-supplier-edit-form');
        valid = false;
      }

      if (!valid) {
        showBarcodeToast(false, '提交失败');
        return false;
      }

      const codes = parseBarcodeCodes(barcodeCodeRaw);
      const status = statusEnabled ? 'active' : 'inactive';
      const remarkText = remark.trim();

      row.barcodeCode = codes[0];
      row.status = status;
      row.remark = remarkText;
      row.hasRemark = !!remarkText;

      if (codes.length > 1) {
        const extraRows = codes.slice(1).map(code => ({
          barcodeType: row.barcodeType,
          supplierCode: row.supplierCode,
          supplierName: row.supplierName,
          barcodeCode: code,
          status,
          hasRemark: !!remarkText,
          remark: remarkText,
          creator: row.creator,
          created: row.created
        }));
        barcodeSupplierRows.splice(rowIndex + 1, 0, ...extraRows);
      }

      refreshBarcodeTable();
      document.getElementById('barcode-supplier-edit-modal')?.classList.add('hidden');
      showBarcodeToast(true);
      return true;
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshBarcodeTable();

      const expandBtn = document.getElementById('barcode-supplier-search-expand');
      const extra = document.getElementById('barcode-supplier-search-extra');
      if (expandBtn && extra) {
        let expanded = true;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          extra.classList.toggle('hidden', !expanded);
          expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
          expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
        });
      }

      document.querySelectorAll('#barcode-supplier-add-form [data-search-select]').forEach(container => {
        const key = container.dataset.searchSelect;
        if (key === 'barcodeType') {
          initSearchSelect(container, barcodeTypeOptions, item => item, item => item);
        } else if (key === 'supplierName') {
          initSearchSelect(container, supplierNameOptions, item => item.name, item => item.name);
        }
      });

      const statusToggle = document.getElementById('barcode-supplier-status-toggle');
      if (statusToggle) {
        statusToggle.addEventListener('change', () => updateStatusToggle(statusToggle.checked, 'add'));
      }

      const editStatusToggle = document.getElementById('barcode-supplier-edit-status-toggle');
      if (editStatusToggle) {
        editStatusToggle.addEventListener('change', () => updateStatusToggle(editStatusToggle.checked, 'edit'));
      }

      const addBtn = document.getElementById('barcode-supplier-add-btn');
      if (addBtn) {
        addBtn.addEventListener('click', () => resetAddForm());
      }

      const submitBtn = document.getElementById('barcode-supplier-add-submit');
      if (submitBtn) {
        submitBtn.addEventListener('click', () => submitAddForm());
      }

      const editSubmitBtn = document.getElementById('barcode-supplier-edit-submit');
      if (editSubmitBtn) {
        editSubmitBtn.addEventListener('click', () => submitEditForm());
      }

      document.querySelectorAll('#barcode-supplier-add-modal [data-modal-close]').forEach(btn => {
        btn.addEventListener('click', () => resetAddForm());
      });

      document.querySelectorAll('#barcode-supplier-edit-modal [data-modal-close]').forEach(btn => {
        btn.addEventListener('click', () => clearEditFormErrors());
      });

      const tbody = document.getElementById('barcode-supplier-table-body');
      if (tbody) {
        tbody.addEventListener('click', e => {
          const editBtn = e.target.closest('.barcode-supplier-edit-btn');
          if (editBtn) {
            e.preventDefault();
            openEditModal(Number(editBtn.dataset.rowIndex));
          }
        });
      }
    });
  </script>
</body>
