<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书馆采选订单管理系统</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
      color: #334155;
      line-height: 1.7;
    }
    h1 { font-size: 1.25rem; color: #0f172a; }
    .highlight {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
    }
    code {
      background: #f1f5f9;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    a.btn {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.5rem 1rem;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    a.btn:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>图书馆采选订单管理系统</h1>
  <div class="highlight">
    <strong>请双击同目录下的「打开原型.bat」</strong>，浏览器会自动打开原型页面。
  </div>
  <p>本项目是 Vue 应用，浏览器安全策略不允许直接双击 HTML 文件打开，必须通过本地服务访问。</p>
  <p>若尚未构建，请先在终端执行：</p>
  <p><code>cd html</code> → <code>npm run build</code></p>
  <p>开发调试时，在 <code>html</code> 目录执行 <code>npm run dev</code>，然后访问终端显示的地址 + <code>/app.html</code>。</p>
</body>
</html>
