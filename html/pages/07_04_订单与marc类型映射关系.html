<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单与MARC类型映射关系</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    /** 订单与MARC类型映射关系：固定页面高度，表格区域独立滚动 */
    body[data-active-page="07_04_订单与marc类型映射关系.html"] #page-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body[data-active-page="07_04_订单与marc类型映射关系.html"] #marc-mapping-page {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    body[data-active-page="07_04_订单与marc类型映射关系.html"] .marc-mapping-table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    body[data-active-page="07_04_订单与marc类型映射关系.html"] .marc-mapping-table-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    body[data-active-page="07_04_订单与marc类型映射关系.html"] .marc-mapping-table-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="订单与MARC类型映射关系"
  data-active-page="07_04_订单与marc类型映射关系.html">

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <div id="marc-mapping-page">
      <!-- 检索区 -->
      <div class="bg-white rounded border border-gray-200 p-4 mb-4 shrink-0">
        <form id="marc-mapping-search-form" class="relative">
          <div class="absolute top-0 right-0 flex items-center gap-2">
            <button type="submit"
              class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">检索</button>
            <button type="button" onclick="Common.resetForm('marc-mapping-search-form')"
              class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
          </div>
          <div class="grid grid-cols-3 gap-4 pr-40">
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">采访资源类型</label>
              <select name="resourceType"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <option value="">请选择</option>
                <option value="图书">图书</option>
                <option value="视听资料">视听资料</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">语种</label>
              <select name="language"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <option value="">请选择</option>
                <option value="中文">中文</option>
                <option value="外文">外文</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">载体</label>
              <select name="carrier"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <option value="">全部</option>
                <option value="TD">TD</option>
                <option value="DVD">DVD</option>
                <option value="VCD">VCD</option>
                <option value="CD">CD</option>
                <option value="V">V</option>
                <option value="AH">AH</option>
                <option value="AP">AP</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">书目库代码</label>
              <input type="text" name="bibCode" placeholder="请输入"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">MARC资源类型</label>
              <select name="marcResourceType"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <option value="">请选择</option>
                <option value="图书">图书</option>
                <option value="电子资源">电子资源</option>
                <option value="影像资料">影像资料</option>
                <option value="录音资料">录音资料</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">MARC格式</label>
              <select name="marcFormat"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <option value="">全部</option>
                <option value="CNMARC">CNMARC</option>
                <option value="MARC21">MARC21</option>
              </select>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-sm text-gray-600 whitespace-nowrap w-28 text-right">MARC类型</label>
              <select name="marcType"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
                <option value="">全部</option>
                <option value="中文图书">中文图书</option>
                <option value="外文图书">外文图书</option>
                <option value="中文电子资源">中文电子资源</option>
                <option value="中文影像资料">中文影像资料</option>
                <option value="中文录音资料">中文录音资料</option>
                <option value="外文电子资源">外文电子资源</option>
                <option value="外文影像资料">外文影像资料</option>
                <option value="外文录音资料">外文录音资料</option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <!-- 数据表格 -->
      <div class="bg-white rounded border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden">
        <div class="marc-mapping-table-scroll table-scroll">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
              <tr>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap w-14">序号</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">采访资源类型</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">语种</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">载体(仅视听)</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">书目库代码</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">MARC格式</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">MARC资源类型</th>
                <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">MARC类型</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100" id="marc-mapping-table-body"></tbody>
          </table>
        </div>
        <!-- 分页 -->
        <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200 shrink-0 bg-white">
          <span class="text-sm text-gray-500" id="marc-mapping-total">共 8 条记录</span>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-500" id="marc-mapping-page-info">第 1/1 页</span>
            <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <input type="text" value="1" readonly
              class="w-10 border border-gray-300 rounded px-2 py-1 text-sm text-center text-gray-600 bg-white">
            <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
              <option selected>50 条/页</option>
              <option>20 条/页</option>
              <option>10 条/页</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 订单与MARC类型映射关系示例数据 */
    const marcMappingRows = [
      { resourceType: '视听资料', language: '中文', carrier: 'TD,DVD,VCD,CD', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '电子资源', marcType: '中文电子资源' },
      { resourceType: '视听资料', language: '中文', carrier: 'V', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '影像资料', marcType: '中文影像资料' },
      { resourceType: '视听资料', language: '中文', carrier: 'AH,AP', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '录音资料', marcType: '中文录音资料' },
      { resourceType: '图书', language: '中文', carrier: '', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '图书', marcType: '中文图书' },
      { resourceType: '图书', language: '外文', carrier: '', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '图书', marcType: '外文图书' },
      { resourceType: '视听资料', language: '外文', carrier: 'TD', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '电子资源', marcType: '外文电子资源' },
      { resourceType: '视听资料', language: '外文', carrier: 'AH,AP', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '录音资料', marcType: '外文录音资料' },
      { resourceType: '视听资料', language: '外文', carrier: 'V,DVD,VCD,CD', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '影像资料', marcType: '外文影像资料' }
    ];

    /** 当前展示的列表数据 */
    let marcMappingDisplayRows = [...marcMappingRows];

    /**
     * 渲染表格行
     * @param {Object} row - 行数据
     * @param {number} index - 序号
     * @returns {string}
     */
    function renderMarcMappingRow(row, index) {
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${index}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.resourceType}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.language}</td>
          <td class="px-3 py-2">${row.carrier || ''}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.bibCode}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.marcFormat}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.marcResourceType}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.marcType}</td>
        </tr>`;
    }

    /**
     * 渲染空结果提示
     * @returns {string}
     */
    function renderMarcMappingEmpty() {
      return `
        <tr>
          <td colspan="8" class="px-3 py-16 text-center text-sm text-gray-400">未检索到结果</td>
        </tr>`;
    }

    /**
     * 刷新列表与分页信息
     */
    function refreshMarcMappingTable() {
      const tbody = document.getElementById('marc-mapping-table-body');
      const totalEl = document.getElementById('marc-mapping-total');
      const pageInfoEl = document.getElementById('marc-mapping-page-info');
      if (!tbody) return;

      const count = marcMappingDisplayRows.length;
      if (count === 0) {
        tbody.innerHTML = renderMarcMappingEmpty();
      } else {
        tbody.innerHTML = marcMappingDisplayRows
          .map((row, i) => renderMarcMappingRow(row, i + 1))
          .join('');
      }

      if (totalEl) totalEl.textContent = `共 ${count} 条记录`;
      if (pageInfoEl) pageInfoEl.textContent = count > 0 ? '第 1/1 页' : '第 0/0 页';
    }

    /**
     * 判断载体是否匹配（支持逗号分隔的多值）
     * @param {string} rowCarrier - 行载体
     * @param {string} filterCarrier - 筛选载体
     * @returns {boolean}
     */
    function matchCarrier(rowCarrier, filterCarrier) {
      if (!filterCarrier) return true;
      const carriers = rowCarrier.split(/[,，]/).map(s => s.trim());
      return carriers.includes(filterCarrier);
    }

    /**
     * 执行检索过滤
     * @param {HTMLFormElement} form - 检索表单
     */
    function searchMarcMapping(form) {
      const resourceType = form.resourceType.value;
      const language = form.language.value;
      const carrier = form.carrier.value;
      const bibCode = form.bibCode.value.trim();
      const marcResourceType = form.marcResourceType.value;
      const marcFormat = form.marcFormat.value;
      const marcType = form.marcType.value;

      marcMappingDisplayRows = marcMappingRows.filter(row => {
        if (resourceType && row.resourceType !== resourceType) return false;
        if (language && row.language !== language) return false;
        if (carrier && !matchCarrier(row.carrier, carrier)) return false;
        if (bibCode && row.bibCode !== bibCode) return false;
        if (marcResourceType && row.marcResourceType !== marcResourceType) return false;
        if (marcFormat && row.marcFormat !== marcFormat) return false;
        if (marcType && row.marcType !== marcType) return false;
        return true;
      });

      refreshMarcMappingTable();
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshMarcMappingTable();

      const form = document.getElementById('marc-mapping-search-form');
      if (form) {
        form.addEventListener('submit', e => {
          e.preventDefault();
          searchMarcMapping(form);
        });
        form.addEventListener('reset', () => {
          setTimeout(() => {
            marcMappingDisplayRows = [...marcMappingRows];
            refreshMarcMappingTable();
          }, 0);
        });
      }
    });
  </script>
</body>
</html>
