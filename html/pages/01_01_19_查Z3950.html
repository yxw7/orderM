      top: -6px;
      right: 12px;

      height: 10px;

      border-left: 1px solid #e5e7eb;

    body[data-active-page="01_01_19_查Z3950.html"] .preview-brief-table tbody tr:nth-child(odd) {

      position: fixed;
      inset: 0;
      z-index: 70;
    }

    .z3950-drawer.hidden {
      pointer-events: none;
    }

    .z3950-drawer-mask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .z3950-drawer.is-open .z3950-drawer-mask {
      opacity: 1;
    }

    .z3950-drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      width: 50%;
      background: #fff;
      box-shadow: -8px 0 24px rgba(15, 23, 42, 0.12);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .z3950-drawer.is-open .z3950-drawer-panel {
      transform: translateX(0);
    }

    .z3950-drawer.is-open {
      pointer-events: auto;
    }

    .z3950-drawer-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;

      { isbn: '978-7-5325-5200-5', linkUrl: '首都图书馆', title: '小王子的星际旅行', author: '蓝山主编', publisher: '江苏凤凰文艺出版社', pubYear: '2018', marcType: 'CNMARC | 中文图书', recordNo: 'Z3950-CLIB-2018006' },
      { isbn: '978-7-5505-0348-9', linkUrl: '北京大学', title: '小王子', author: '蓝山主编', publisher: '大连出版社', pubYear: '2016', marcType: 'CNMARC | 中文图书', recordNo: 'Z3950-PKU-2016007' },
      { isbn: '978-7-5325-5201-2', linkUrl: '华盛顿大学', title: '小王子的星际旅行', author: '蓝山主编', publisher: '江苏凤凰文艺出版社', pubYear: '2019', marcType: 'CNMARC | 中文图书', recordNo: 'Z3950-UW-2019008' },

      { isbn: '978-7-5302-2109-9', linkUrl: '北京大学', title: '查Z3950示例书目', author: '示例作者', publisher: '示例出版社', pubYear: '2020', marcType: 'CNMARC | 中文图书', recordNo: 'Z3950-PKU-2020010' }
    ];

    /** Z3950 检索结果表格列默认配置 */
    const DEFAULT_Z3950_COLUMNS = [
      { key: 'index', label: '序号', visible: true, fixed: false, width: 'w-14' },
      { key: 'linkUrl', label: '链接网址', visible: true, fixed: false, minWidth: 'min-w-[100px]' },
      { key: 'isbn', label: 'ISBN/ISSN', visible: true, fixed: false },
      { key: 'title', label: '题名', visible: true, fixed: false, minWidth: 'min-w-[120px]' },
      { key: 'author', label: '责任者', visible: true, fixed: false },
      { key: 'publisher', label: '出版社', visible: true, fixed: false, minWidth: 'min-w-[120px]' },
      { key: 'pubYear', label: '出版时间', visible: true, fixed: false },
      { key: 'actions', label: '操作', visible: true, fixed: true }
    ];

    /** @type {Object[]} 当前 Z3950 列配置 */
    let z3950ColumnConfig = DEFAULT_Z3950_COLUMNS.map(col => ({ ...col }));

    /** @type {string|null} 列拖拽源 key */
    let draggingColumnKey = null;

    /** 扩展至 85 条记录（原型演示） */
    const ALL_Z3950_ROWS = Array.from({ length: 85 }, (_, index) => {
      const base = Z3950_SAMPLE_ROWS[index % Z3950_SAMPLE_ROWS.length];
      return { ...base, id: index + 1 };
    });

    /** @type {Object|null} 当前查看的 Z3950 记录 */
    let currentDetailRow = null;

    /** @type {Object[]} 当前过滤后的 Z3950 数据 */
    let filteredZ3950Rows = [...ALL_Z3950_ROWS];

    /** @type {number} 当前页码 */
    let currentPage = 1;

    /** @type {number} 每页条数 */
    let pageSize = 5;

    /** @type {boolean} 预览简编侧滑面板是否打开 */
    let z3950PreviewDrawerOpen = false;

    /** @type {boolean} 详细信息侧滑面板是否打开 */
    let z3950DetailDrawerOpen = false;

    /** @type {number|null} 预览简编侧滑面板关闭动画定时器 */
    let z3950PreviewDrawerTimer = null;

    /** @type {number|null} 详细信息侧滑面板关闭动画定时器 */
    let z3950DetailDrawerTimer = null;

    /**
     * 深拷贝书目库列默认配置
     * @returns {Object[]}
     */
    function cloneDefaultZ3950Columns() {
      return DEFAULT_Z3950_COLUMNS.map(col => ({ ...col }));
    }

    function getVisibleZ3950Columns() {
      const unfixed = z3950ColumnConfig.filter(col => !col.fixed && col.visible);
      const fixed = z3950ColumnConfig.filter(col => col.fixed && col.visible);
      return [...unfixed, ...fixed];
    }

    function getConfigurableZ3950Columns() {
      return z3950ColumnConfig.filter(col => !col.fixed);
    }

    function updateZ3950ColumnSelectAllState() {
      const selectAll = document.getElementById('z3950-column-select-all');
      if (!selectAll) return;

      const configurable = getConfigurableZ3950Columns();
      const checkedCount = configurable.filter(col => col.visible).length;
      selectAll.checked = checkedCount === configurable.length;
      selectAll.indeterminate = checkedCount > 0 && checkedCount < configurable.length;
    }

    function renderZ3950ColumnSettingsList() {
      const container = document.getElementById('z3950-column-list');
      if (!container) return;

      container.innerHTML = getConfigurableZ3950Columns().map(col => `
        <div class="z3950-column-item flex items-center gap-2 px-3 py-1.5 hover:bg-gray-50 cursor-move"
          draggable="true" data-column-key="${col.key}">
          <svg class="w-3 h-3 text-gray-300 shrink-0" viewBox="0 0 12 12" fill="currentColor">
            <circle cx="3" cy="2" r="1"/><circle cx="9" cy="2" r="1"/>
            <circle cx="3" cy="6" r="1"/><circle cx="9" cy="6" r="1"/>
            <circle cx="3" cy="10" r="1"/><circle cx="9" cy="10" r="1"/>
          </svg>
          <label class="flex items-center gap-2 flex-1 cursor-pointer">
            <input type="checkbox" class="z3950-column-checkbox rounded text-sky-600"
              data-column-key="${col.key}" ${col.visible ? 'checked' : ''}>
            <span class="text-gray-700">${col.label}</span>
          </label>
        </div>
      `).join('');

      container.querySelectorAll('.z3950-column-item').forEach(item => {
        item.addEventListener('dragstart', e => {
          draggingColumnKey = item.dataset.columnKey;
          item.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', () => {
          draggingColumnKey = null;
          item.classList.remove('is-dragging');
        });
        item.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        item.addEventListener('drop', e => {
          e.preventDefault();
          if (!draggingColumnKey || item.dataset.columnKey === draggingColumnKey) return;

          const fromIndex = z3950ColumnConfig.findIndex(col => col.key === draggingColumnKey);
          const toIndex = z3950ColumnConfig.findIndex(col => col.key === item.dataset.columnKey);
          if (fromIndex === -1 || toIndex === -1) return;

          const [moved] = z3950ColumnConfig.splice(fromIndex, 1);
          z3950ColumnConfig.splice(toIndex, 0, moved);
          renderZ3950ColumnSettingsList();
          renderZ3950TableHead();
          refreshZ3950Table();
        });
      });

      container.querySelectorAll('.z3950-column-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', e => {
          e.stopPropagation();
          const column = z3950ColumnConfig.find(col => col.key === checkbox.dataset.columnKey);
          if (!column) return;
          column.visible = checkbox.checked;
          updateZ3950ColumnSelectAllState();
          renderZ3950TableHead();
          refreshZ3950Table();
        });
      });

      updateZ3950ColumnSelectAllState();
    }

    function renderZ3950TableHead() {
      const headRow = document.getElementById('z3950-table-head');
      if (!headRow) return;

      headRow.innerHTML = getVisibleZ3950Columns().map(col => {
        const stickyCls = col.fixed ? ' sticky right-0 bg-gray-50' : '';
        const widthCls = [col.width, col.minWidth].filter(Boolean).join(' ');
        return `<th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap ${widthCls}${stickyCls}">${col.label}</th>`;
      }).join('');
    }

    function getZ3950CellContent(row, col, index) {
      if (col.key === 'index') return String(index);
      if (col.key === 'actions') {
        return `<a href="#" class="text-sky-600 hover:underline z3950-preview-btn" data-row-id="${row.id}">预览简编</a>`
          + `<span class="text-gray-300 mx-1">|</span>`
          + `<a href="#" class="text-sky-600 hover:underline z3950-download-btn" data-row-id="${row.id}">下载详情</a>`;
      }
      return row[col.key] ?? '—';
    }

    /**
     * 按检索字段类型匹配行数据
     * @param {Object} row - 行数据
     * @param {string} type - 字段类型
     * @param {string} value - 检索值
     * @returns {boolean}
     */
    function matchZ3950Field(row, type, value) {
      if (!value) return true;
      const fieldMap = {
        isbn: row.isbn,
        title: row.title,
        author: row.author,
        publisher: row.publisher
      };
      const text = fieldMap[type] ?? '';
      return String(text).includes(value);
    }

    function positionZ3950ColumnSettingsPopover() {
      const popover = document.getElementById('z3950-column-settings-popover');
      const trigger = document.getElementById('z3950-settings-btn');
      if (!popover || !trigger || popover.classList.contains('hidden')) return;

      const rect = trigger.getBoundingClientRect();
      const gap = 8;
      const popoverWidth = popover.offsetWidth || 220;

      let top = rect.bottom + gap;
      let left = rect.right - popoverWidth;

      left = Math.max(8, Math.min(left, window.innerWidth - popoverWidth - 8));

      const maxHeight = window.innerHeight - top - 16;
      const list = document.getElementById('z3950-column-list');
      if (list && maxHeight < 280) {
        list.style.maxHeight = `${Math.max(120, maxHeight - 140)}px`;
      } else if (list) {
        list.style.maxHeight = '224px';
      }

      if (top + popover.offsetHeight > window.innerHeight - 8) {
        top = Math.max(8, rect.top - popover.offsetHeight - gap);
      }

      popover.style.top = `${top}px`;
      popover.style.left = `${left}px`;
    }

    function toggleZ3950ColumnSettingsPopover(show) {
      const popover = document.getElementById('z3950-column-settings-popover');
      if (!popover) return;

      const shouldShow = typeof show === 'boolean' ? show : popover.classList.contains('hidden');
      if (shouldShow) {
        renderZ3950ColumnSettingsList();
        popover.classList.remove('hidden');
        positionZ3950ColumnSettingsPopover();
        return;
      }
      popover.classList.add('hidden');
    }

    function resetZ3950ColumnSettings() {
      z3950ColumnConfig = cloneDefaultZ3950Columns();
      renderZ3950ColumnSettingsList();
      renderZ3950TableHead();
      refreshZ3950Table();
    }

    /**
     * 关闭预览简编侧滑面板
     */
    function closeZ3950PreviewDrawer() {
      const drawer = document.getElementById('z3950-preview-drawer');
      if (!drawer || !z3950PreviewDrawerOpen) return;

      drawer.classList.remove('is-open');
      drawer.setAttribute('aria-hidden', 'true');
      z3950PreviewDrawerOpen = false;
      if (!z3950DetailDrawerOpen) {
        document.body.classList.remove('z3950-drawer-open');
      }

      z3950PreviewDrawerTimer = window.setTimeout(() => {
        drawer.classList.add('hidden');
        z3950PreviewDrawerTimer = null;
      }, 300);
    }

    /**
     * 关闭详细信息侧滑面板
     */
    function closeZ3950DetailDrawer() {
      const drawer = document.getElementById('z3950-detail-drawer');
      if (!drawer || !z3950DetailDrawerOpen) return;

      drawer.classList.remove('is-open');
      drawer.setAttribute('aria-hidden', 'true');
      z3950DetailDrawerOpen = false;
      if (!z3950PreviewDrawerOpen) {
        document.body.classList.remove('z3950-drawer-open');
      }

      z3950DetailDrawerTimer = window.setTimeout(() => {
        drawer.classList.add('hidden');
        z3950DetailDrawerTimer = null;
      }, 300);
    }

    /**
     * 打开预览简编侧滑面板
     */
    function openZ3950PreviewDrawerPanel() {
      const drawer = document.getElementById('z3950-preview-drawer');
      if (!drawer) return;

      toggleZ3950ColumnSettingsPopover(false);
      closeZ3950DetailDrawer();

      if (z3950PreviewDrawerTimer) {
        clearTimeout(z3950PreviewDrawerTimer);
        z3950PreviewDrawerTimer = null;
      }

      drawer.classList.remove('hidden');
      drawer.setAttribute('aria-hidden', 'false');
      document.body.classList.add('z3950-drawer-open');

      requestAnimationFrame(() => {
        drawer.classList.add('is-open');
      });

      z3950PreviewDrawerOpen = true;
    }

    /**
     * 打开详细信息侧滑面板
     */
    function openZ3950DetailDrawerPanel() {
      const drawer = document.getElementById('z3950-detail-drawer');
      if (!drawer) return;

      toggleZ3950ColumnSettingsPopover(false);
      closeZ3950PreviewDrawer();

      if (z3950DetailDrawerTimer) {
        clearTimeout(z3950DetailDrawerTimer);
        z3950DetailDrawerTimer = null;
      }

      drawer.classList.remove('hidden');
      drawer.setAttribute('aria-hidden', 'false');
      document.body.classList.add('z3950-drawer-open');

      requestAnimationFrame(() => {
        drawer.classList.add('is-open');
      });

      z3950DetailDrawerOpen = true;
    }

    /**
     * 将 MARC 子字段标识渲染为蓝色
     * @param {string} content - 字段信息原文
     * @returns {string}
     */
    function formatMarcSubfieldHtml(content) {
      if (!content) return '';
      return content.replace(/▼([a-z0-9])/gi, '<span class="text-sky-600">▼$1</span>');
    }

    /**
     * 构建预览简编 MARC 字段列表
     * @param {Object} row - Z3950 记录
     * @returns {{field: string, indicator: string, content: string}[]}
     */
    function buildPreviewBriefFields(row) {
      if (row.title.includes('文城')) {
        return [
          { field: 'LDR', indicator: '', content: '00842nam0#2200241###450#' },
          { field: '005', indicator: '', content: '20211012163100.7' },
          { field: '200', indicator: '', content: '▼a文城 ▼9wen cheng ▼f余华 著' },
          { field: '210', indicator: '', content: '▼a北京 ▼c北京十月文艺出版社 ▼d2021' },
          { field: '215', indicator: '', content: '▼a348页 ▼d21cm' },
          { field: '701', indicator: '', content: '▼a余华 ▼9yu hua ▼4著' }
        ];
      }

      const authorPlain = row.author.replace(/\s*(著|主编)\s*$/u, '').trim();
      const authorSuffix = row.author.includes('主编') ? '▼4主编' : '▼4著';
      const pubPlace = row.publisher.includes('北京') ? '北京' : row.publisher.replace(/出版社.*/u, '').trim() || row.publisher;

      return [
        { field: 'LDR', indicator: '', content: '00842nam0#2200241###450#' },
        { field: '005', indicator: '', content: '20211012163100.7' },
        { field: '200', indicator: '', content: `▼a${row.title} ▼f${row.author}` },
        { field: '210', indicator: '', content: `▼a${pubPlace} ▼c${row.publisher} ▼d${row.pubYear}` },
        { field: '215', indicator: '', content: '▼a348页 ▼d21cm' },
        { field: '701', indicator: '', content: `▼a${authorPlain} ${authorSuffix}` }
      ];
    }

    /**
     * 渲染预览简编内容
     * @param {Object} row - Z3950 记录
     */
    function renderPreviewBrief(row) {
      const sourceEl = document.getElementById('z3950-preview-drawer-source');
      const tbody = document.getElementById('z3950-preview-drawer-body');
      if (!sourceEl || !tbody) return;

      sourceEl.textContent = row.linkUrl || '—';
      const fields = buildPreviewBriefFields(row);

      tbody.innerHTML = fields.map(item => `
        <tr class="border-b border-gray-100">
          <td class="px-3 py-2.5 text-gray-800 whitespace-nowrap">${item.field}</td>
          <td class="px-3 py-2.5 text-gray-600 whitespace-nowrap">${item.indicator || ''}</td>
          <td class="px-3 py-2.5 text-gray-800 break-all leading-relaxed">${formatMarcSubfieldHtml(item.content)}</td>
        </tr>
      `).join('');
    }

    /**
     * 打开预览简编页签
     * @param {number|string} rowId - 记录 ID
     */
    function openZ3950Preview(rowId) {
      const row = ALL_Z3950_ROWS.find(item => String(item.id) === String(rowId));
      if (!row) return;

      currentDetailRow = row;
      renderPreviewBrief(row);
      openZ3950PreviewDrawerPanel();
    }

    /**
     * 根据书目数据构建 MARC 字段详情
     * @param {Object} row - 书目数据
     * @returns {{field: string, indicator: string, content: string}[]}
     */
    function buildMarcDetailFields(row) {
      const recordNo = row.recordNo || `Z3950-${row.id}`;
      const summary = row.title.includes('文城')
        ? '▼a本书讲述青年林祥福携女寻妻，在江南文城落脚并经历时代变迁的故事。'
        : row.title.includes('星际')
          ? '▼a本书讲述小王子离开星球后在星际旅行中的所见所感，以童话形式探讨成长、责任与爱的主题。'
          : '▼a本书以飞行员视角讲述小王子与玫瑰、狐狸的故事，探讨孤独、友谊与生命意义，是世界经典童话文学作品。';

      return [
        { field: 'LDR', indicator: '', content: '*****njm#22^^^^1a4500' },
        { field: 'FMT', indicator: '', content: row.marcType || 'CNMARC | 中文图书' },
        { field: '001', indicator: '', content: recordNo },
        { field: '010', indicator: '', content: `▼a${row.isbn}` },
        { field: '101', indicator: '0', content: row.marcType?.includes('MARC21') ? '▼a eng' : '▼a chi' },
        { field: '200', indicator: '1', content: `▼a${row.title}▼b专著▼f${row.author}▼c${row.publisher}` },
        { field: '210', indicator: '', content: `▼c${row.publisher}▼d${row.pubYear}` },
        { field: '330', indicator: '', content: summary },
        { field: '856', indicator: '', content: `▼a${row.linkUrl}` }
      ];
    }

    function renderMarcDetail(row) {
      const sourceEl = document.getElementById('z3950-detail-drawer-source');
      const tbody = document.getElementById('z3950-detail-drawer-marc-body');
      if (!sourceEl || !tbody) return;

      sourceEl.textContent = row.linkUrl || '—';
      const fields = buildMarcDetailFields(row);

      tbody.innerHTML = fields.map(item => `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600 whitespace-nowrap">${item.field}</td>
          <td class="px-3 py-2 text-gray-600 whitespace-nowrap">${item.indicator || ''}</td>
          <td class="px-3 py-2 text-gray-700 break-all leading-relaxed">${item.content || ''}</td>
        </tr>
      `).join('');
    }

    function openZ3950Detail(rowId) {
      const row = ALL_Z3950_ROWS.find(item => String(item.id) === String(rowId));
      if (!row) return;

      currentDetailRow = row;
      renderMarcDetail(row);
      openZ3950DetailDrawerPanel();
    }

    /** 订单与 MARC 类型映射关系（同 07_04_订单与marc类型映射关系） */
    const MARC_TYPE_MAPPING_ROWS = [
      { resourceType: '视听资料', language: '中文', carrier: 'TD,DVD,VCD,CD', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '电子资源', marcType: '中文电子资源' },

      { resourceType: '视听资料', language: '中文', carrier: 'AH,AP', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '录音资料', marcType: '中文录音资料' },
      { resourceType: '图书', language: '中文', carrier: '', bibCode: 'STL01', marcFormat: 'CNMARC', marcResourceType: '图书', marcType: '中文图书' },
      { resourceType: '图书', language: '外文', carrier: '', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '图书', marcType: '外文图书' },
      { resourceType: '视听资料', language: '外文', carrier: 'TD', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '电子资源', marcType: '外文电子资源' },
      { resourceType: '视听资料', language: '外文', carrier: 'AH,AP', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '录音资料', marcType: '外文录音资料' },
      { resourceType: '视听资料', language: '外文', carrier: 'V,DVD,VCD,CD', bibCode: 'STL01', marcFormat: 'MARC21', marcResourceType: '影像资料', marcType: '外文影像资料' }
    ];

    /**
     * 解析书目 MARC 类型标签
     * @param {string} marcTypeLabel - 如 CNMARC | 中文图书
     * @returns {{marcFormat: string, marcType: string}|null}
     */
    function parseMarcTypeLabel(marcTypeLabel) {
      if (!marcTypeLabel) return null;
      const parts = marcTypeLabel.split('|').map(part => part.trim()).filter(Boolean);
      if (parts.length >= 2) {
        return { marcFormat: parts[0], marcType: parts.slice(1).join(' | ') };
      }
      return { marcFormat: '', marcType: marcTypeLabel.trim() };
    }

    /**
     * 根据 MARC 类型映射获取订单资源类型与语种
     * @param {Object} bibRow - 书目数据
     * @returns {{resourceType: string, language: string}|null}
     */
    function resolveOrderFieldsFromMarcMapping(bibRow) {
      const parsed = parseMarcTypeLabel(bibRow?.marcType);
      if (!parsed?.marcType) return null;

      const mapping = MARC_TYPE_MAPPING_ROWS.find(row =>
        row.marcFormat === parsed.marcFormat && row.marcType === parsed.marcType
      );
      if (!mapping) return null;

      return {
        resourceType: mapping.resourceType === '图书' ? '纸质书' : mapping.resourceType,
        language: mapping.language
      };
    }

    /**
     * 将 MARC 映射结果写入新建订单表单
     * @param {HTMLFormElement} form - 新建订单表单
     * @param {Object} bibRow - 书目数据
     */
    function applyMarcMappingToNewOrderForm(form, bibRow) {
      const mapped = resolveOrderFieldsFromMarcMapping(bibRow);
      if (!mapped || !form) return;

      if (form.elements.resourceType && [...form.elements.resourceType.options].some(opt => opt.value === mapped.resourceType)) {
        form.elements.resourceType.value = mapped.resourceType;
      }
      if (form.elements.language && [...form.elements.language.options].some(opt => opt.value === mapped.language)) {
        form.elements.language.value = mapped.language;
      }
    }

    /**
     * 基于当前书目详情打开新建订单弹窗
     */
    function handleCreateOrderFromDetail() {
      if (!currentDetailRow) {
        alert('请先选择书目记录');
        return;
      }
      openNewOrderModal(currentDetailRow);
    }

    /** 新建订单必填字段 */
    const NEW_ORDER_REQUIRED_FIELDS = [
      { name: 'subscriber', label: '订户' },
      { name: 'resourceType', label: '资源类型' },
      { name: 'method', label: '采选方式' },
      { name: 'budget', label: '预算名称' },
      { name: 'language', label: '语种' },
      { name: 'supplier', label: '供应商' },
      { name: 'site', label: '馆址' }
    ];

    /**
     * 打开新建订单弹窗
     * @param {Object|null} [bibRow] - 书目数据，传入时按 MARC 映射带入资源类型与语种
     */
    function openNewOrderModal(bibRow = null) {
      toggleZ3950ColumnSettingsPopover(false);
      const form = document.getElementById('new-order-form');
      if (form) form.reset();
      if (bibRow) {
        applyMarcMappingToNewOrderForm(form, bibRow);
      }
      document.getElementById('new-order-modal')?.classList.remove('hidden');
    }

    /**
     * 格式化日期时间
     * @param {Date} date - 日期对象
     * @returns {string}
     */
    function formatDateTime(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} `
        + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    /**
     * 提交新建订单并返回订单列表
     */
    function handleNewOrderSubmit() {
      const form = document.getElementById('new-order-form');
      if (!form) return;

      const missing = NEW_ORDER_REQUIRED_FIELDS.find(field => !form.elements[field.name].value);
      if (missing) {
        alert(`请选择${missing.label}`);
        return;
      }

      const now = new Date();
      const datePart = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, '0'),
        String(now.getDate()).padStart(2, '0')
      ].join('');
      const seq = String(now.getTime()).slice(-3);
      const orderId = `PG001B${datePart}${seq}`;
      const discount = form.elements.discount.value.trim();

      const newOrder = {
        subscriber: form.elements.subscriber.value,
        site: form.elements.site.value,
        orderId,
        method: form.elements.method.value,
        resourceType: form.elements.resourceType.value,
        language: form.elements.language.value,
        supplier: form.elements.supplier.value,
        orderTime: formatDateTime(now),
        issuer: '系统',
        issueTime: '',
        orderVolumes: 0,
        orderSpecies: 0,
        budget: form.elements.budget.value,
        listPrice: '0.00',
        discount: discount || '—',
        netPrice: '0.00',
        hasRemark: false,
        orderStatus: 'pendingImport',
        settlementStatus: 'unsettled',
        bibRecordNo: currentDetailRow?.recordNo || '',
        bibTitle: currentDetailRow?.title || ''
      };

      sessionStorage.setItem('pendingNewOrder', JSON.stringify(newOrder));
      document.getElementById('new-order-modal')?.classList.add('hidden');
      location.href = '01_01_非连续出版物订单-订单列表.html';
    }

    /**
     * 渲染书目库表格行
     * @param {Object} row - 书目数据
     * @param {number} index - 序号
     * @returns {string} HTML 字符串
     */
    function renderZ3950Row(row, index) {
      const cells = getVisibleZ3950Columns().map(col => {
        const stickyCls = col.fixed ? ' sticky right-0 bg-white' : '';
        const emphasisCls = col.key === 'title' ? ' text-gray-800' : ' text-gray-600';
        const nowrapCls = ['isbn'].includes(col.key) ? ' whitespace-nowrap' : '';
        const content = getZ3950CellContent(row, col, index);
        return `<td class="px-3 py-2${emphasisCls}${nowrapCls}${stickyCls}">${content}</td>`;
      }).join('');

      return `<tr class="hover:bg-sky-50/50">${cells}</tr>`;
    }

    function renderZ3950PageButtons(totalPages) {
      const container = document.getElementById('z3950-page-btns');
      if (!container) return;

      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);
      if (endPage - startPage + 1 < maxVisible) {
        startPage = Math.max(1, endPage - maxVisible + 1);
      }

      container.innerHTML = '';
      for (let page = startPage; page <= endPage; page += 1) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.page = String(page);
        btn.className = page === currentPage
          ? 'px-2.5 py-1 bg-sky-600 text-white rounded'
          : 'px-2.5 py-1 border border-gray-300 rounded text-gray-600 hover:bg-gray-50';
        btn.textContent = String(page);
        btn.addEventListener('click', () => {
          currentPage = page;
          refreshZ3950Table();
        });
        container.appendChild(btn);
      }
    }

    function refreshZ3950Table() {
      const tbody = document.getElementById('z3950-table-body');
      const totalEl = document.getElementById('z3950-total');
      const prevBtn = document.getElementById('z3950-prev');
      const nextBtn = document.getElementById('z3950-next');
      if (!tbody || !totalEl) return;

      const total = filteredZ3950Rows.length;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      currentPage = Math.min(currentPage, totalPages);

      const start = (currentPage - 1) * pageSize;
      const pageRows = filteredZ3950Rows.slice(start, start + pageSize);

      tbody.innerHTML = pageRows
        .map((row, idx) => renderZ3950Row(row, start + idx + 1))
        .join('');

      totalEl.textContent = `共 ${total} 条记录`;
      renderZ3950PageButtons(totalPages);

      if (prevBtn) {
        prevBtn.disabled = currentPage <= 1;
        prevBtn.classList.toggle('text-gray-400', currentPage <= 1);
        prevBtn.classList.toggle('text-gray-600', currentPage > 1);
        prevBtn.classList.toggle('hover:bg-gray-50', currentPage > 1);
      }
      if (nextBtn) {
        nextBtn.disabled = currentPage >= totalPages;
        nextBtn.classList.toggle('text-gray-400', currentPage >= totalPages);
        nextBtn.classList.toggle('text-gray-600', currentPage < totalPages);
        nextBtn.classList.toggle('hover:bg-gray-50', currentPage < totalPages);
      }
    }

    function applyZ3950SearchFilter() {
      const form = document.getElementById('z3950-search-form');
      if (!form) return;

      const field1Type = form.elements.field1Type?.value || 'isbn';
      const field2Type = form.elements.field2Type?.value || 'title';
      const field3Type = form.elements.field3Type?.value || 'publisher';
      const field1Value = (form.elements.field1Value?.value || '').trim();
      const field2Value = (form.elements.field2Value?.value || '').trim();
      const field3Value = (form.elements.field3Value?.value || '').trim();

      filteredZ3950Rows = ALL_Z3950_ROWS.filter(row =>
        matchZ3950Field(row, field1Type, field1Value)
        && matchZ3950Field(row, field2Type, field2Value)
        && matchZ3950Field(row, field3Type, field3Value)
      );

      currentPage = 1;
      refreshZ3950Table();
    }

    function resetZ3950Search() {
      const form = document.getElementById('z3950-search-form');
      if (form) form.reset();

      filteredZ3950Rows = [...ALL_Z3950_ROWS];
      currentPage = 1;
      refreshZ3950Table();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const serversEl = document.getElementById('z3950-breadcrumb-servers');
      if (serversEl && AppConfig.hasZ3950Config()) {
        serversEl.textContent = `【${AppConfig.getZ3950ServersLabel()}】`;
      }

      document.getElementById('z3950-search-form')?.addEventListener('submit', e => {
        e.preventDefault();
        applyZ3950SearchFilter();
      });

      document.getElementById('z3950-reset-btn')?.addEventListener('click', resetZ3950Search);

      const searchToggle = document.getElementById('z3950-search-expand-btn');
      const searchExtra = document.getElementById('z3950-search-extra');
      if (searchToggle && searchExtra) {
        let searchExpanded = true;
        searchToggle.addEventListener('click', () => {
          searchExpanded = !searchExpanded;
          searchExtra.classList.toggle('hidden', !searchExpanded);
          searchToggle.childNodes[0].textContent = searchExpanded ? '收起 ' : '展开 ';
          searchToggle.querySelector('svg').classList.toggle('rotate-180', searchExpanded);
        });
      }

      document.getElementById('z3950-prev')?.addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage -= 1;
          refreshZ3950Table();
        }
      });

      document.getElementById('z3950-next')?.addEventListener('click', () => {
        const totalPages = Math.ceil(filteredZ3950Rows.length / pageSize);
        if (currentPage < totalPages) {
          currentPage += 1;
          refreshZ3950Table();
        }
      });

      document.getElementById('z3950-page-size')?.addEventListener('change', e => {
        pageSize = Number(e.target.value) || 5;
        currentPage = 1;
        refreshZ3950Table();
      });

      document.getElementById('z3950-table-body')?.addEventListener('click', e => {
        const previewBtn = e.target.closest('.z3950-preview-btn');
        if (previewBtn) {
          e.preventDefault();
          openZ3950Preview(previewBtn.dataset.rowId);
          return;
        }
        const downloadBtn = e.target.closest('.z3950-download-btn');
        if (downloadBtn) {
          e.preventDefault();
          openZ3950Detail(downloadBtn.dataset.rowId);
        }
      });

      document.getElementById('z3950-preview-drawer-close')?.addEventListener('click', closeZ3950PreviewDrawer);
      document.getElementById('z3950-preview-drawer-mask')?.addEventListener('click', closeZ3950PreviewDrawer);
      document.getElementById('z3950-preview-drawer-panel')?.addEventListener('click', event => {
        event.stopPropagation();
      });

      document.getElementById('z3950-detail-drawer-close')?.addEventListener('click', closeZ3950DetailDrawer);
      document.getElementById('z3950-detail-drawer-mask')?.addEventListener('click', closeZ3950DetailDrawer);
      document.getElementById('z3950-detail-drawer-panel')?.addEventListener('click', event => {
        event.stopPropagation();
      });

      document.getElementById('new-order-submit')?.addEventListener('click', handleNewOrderSubmit);

      document.getElementById('z3950-settings-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        toggleZ3950ColumnSettingsPopover();
      });

      document.getElementById('z3950-column-reset-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        resetZ3950ColumnSettings();
      });

      document.getElementById('z3950-column-select-all')?.addEventListener('change', e => {
        const checked = e.target.checked;
        getConfigurableZ3950Columns().forEach(col => {
          col.visible = checked;
        });
        renderZ3950ColumnSettingsList();
        renderZ3950TableHead();
        refreshZ3950Table();
      });

      document.addEventListener('click', e => {
        const popover = document.getElementById('z3950-column-settings-popover');
        const settingsBtn = document.getElementById('z3950-settings-btn');
        if (!popover || popover.classList.contains('hidden')) return;
        if (popover.contains(e.target) || settingsBtn?.contains(e.target)) return;
        toggleZ3950ColumnSettingsPopover(false);
      });

      window.addEventListener('resize', () => positionZ3950ColumnSettingsPopover());
      document.addEventListener('scroll', () => positionZ3950ColumnSettingsPopover(), true);

      renderZ3950TableHead();
      refreshZ3950Table();
    });
  </script>
</body>
</html>
