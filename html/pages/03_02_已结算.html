<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>已结算</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="已结算"
  data-active-page="03_02_已结算.html">

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4">
      <form id="settled-search-form" class="relative">
        <div class="absolute top-0 right-0 flex items-center gap-2">
          <button type="button" id="settled-search-expand"
            class="flex items-center gap-1 text-sm text-sky-600 hover:text-sky-700">
            收起
            <svg class="w-3 h-3 transition-transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
          <button type="submit"
            class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">检索</button>
          <button type="button" onclick="Common.resetForm('settled-search-form')"
            class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
        </div>
        <div class="grid grid-cols-3 gap-4 pr-72">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">结算单号</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">结算单名称</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">资源类型</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>纸质书</option>
              <option>视听资料</option>
            </select>
          </div>
        </div>
        <div id="settled-search-extra" class="grid grid-cols-3 gap-4 mt-3 pr-72">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">供应商</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>北京人天</option>
              <option>北京新华</option>
              <option>中国嘉德</option>
              <option>北京台湖</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">发货单号</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">预算名称</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2 col-span-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">结算时间</label>
            <div class="flex flex-1 items-center gap-2 max-w-md">
              <input type="date"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <span class="text-gray-400 text-sm">~</span>
              <input type="date"
                class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            </div>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-24 text-right">结算操作人</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option value="">请输入</option>
              <option>系统</option>
              <option>李佳</option>
              <option>黄俊</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200">
      <div class="overflow-x-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">结算单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[140px]">结算单名称</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">发货单号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">供应商</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">实收总实洋(元)</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">资源类型</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap min-w-[120px]">预算名称</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                <span class="inline-flex items-center gap-1">
                  结算时间
                  <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>
                </span>
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">结算操作人</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap sticky right-0 bg-gray-50">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100" id="settled-table-body"></tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
        <span class="text-sm text-gray-500">共 6 条</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option>10 条/页</option>
            <option>20 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 已结算列表示例数据 */
    const settledRows = [
      {
        no: 1,
        settleId: 'jsPG09120260602001',
        settleName: '纸质书20260602001',
        deliveryId: 'fhPG09120260602001',
        supplier: '北京人天',
        netPrice: '1280.00',
        resourceType: '纸质书',
        budget: '集团2020年度预算',
        settleTime: '2020-06-02 09:53:18',
        operator: '系统'
      },
      {
        no: 2,
        settleId: 'jsPG09120260602002',
        settleName: '纸质书20260602002',
        deliveryId: 'fhPG09120260602002',
        supplier: '北京新华',
        netPrice: '560.00',
        resourceType: '纸质书',
        budget: '集团2020年度预算',
        settleTime: '2020-06-02 10:12:05',
        operator: '李佳'
      },
      {
        no: 3,
        settleId: 'jsPG09120260602003',
        settleName: '视听资料20260602003',
        deliveryId: '',
        supplier: '中国嘉德',
        netPrice: '320.00',
        resourceType: '视听资料',
        budget: '集团2020年度预算',
        settleTime: '2020-06-02 11:08:42',
        operator: '系统'
      },
      {
        no: 4,
        settleId: 'jsPG09120260602004',
        settleName: '纸质书20260602004',
        deliveryId: 'fhPG09120260602004',
        supplier: '北京台湖',
        netPrice: '890.50',
        resourceType: '纸质书',
        budget: '集团2021年度预算',
        settleTime: '2020-06-02 14:25:33',
        operator: '黄俊'
      },
      {
        no: 5,
        settleId: 'jsPG09120260602005',
        settleName: '视听资料20260602005',
        deliveryId: 'fhPG09120260602005',
        supplier: '北京人天',
        netPrice: '156.00',
        resourceType: '视听资料',
        budget: '集团2020年度预算',
        settleTime: '2020-06-02 15:40:17',
        operator: '系统'
      },
      {
        no: 6,
        settleId: 'jsPG09120260602006',
        settleName: '纸质书20260602006',
        deliveryId: '',
        supplier: '北京新华',
        netPrice: '2340.00',
        resourceType: '纸质书',
        budget: '集团2020年度预算',
        settleTime: '2020-06-02 16:55:09',
        operator: '李佳'
      }
    ];

    /**
     * 渲染已结算表格行
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderSettledRow(row) {
      const delivery = row.deliveryId || '—';
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${row.no}</td>
          <td class="px-3 py-2 whitespace-nowrap">
            <a href="03_02_01_结算详情.html?id=${row.settleId}" class="text-sky-600 hover:underline">${row.settleId}</a>
          </td>
          <td class="px-3 py-2">${row.settleName}</td>
          <td class="px-3 py-2 text-gray-500">${delivery}</td>
          <td class="px-3 py-2">${row.supplier}</td>
          <td class="px-3 py-2">${row.netPrice}</td>
          <td class="px-3 py-2">${row.resourceType}</td>
          <td class="px-3 py-2">${row.budget}</td>
          <td class="px-3 py-2 whitespace-nowrap">${row.settleTime}</td>
          <td class="px-3 py-2">${row.operator}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">
            <a href="03_02_01_结算详情.html?id=${row.settleId}" class="text-sky-600 hover:underline mr-3">详情</a>
            <a href="03_02_03_结算清单.html?id=${row.settleId}" class="text-sky-600 hover:underline">清单</a>
          </td>
        </tr>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('settled-table-body');
      if (tbody) tbody.innerHTML = settledRows.map(renderSettledRow).join('');

      const expandBtn = document.getElementById('settled-search-expand');
      const extra = document.getElementById('settled-search-extra');
      if (expandBtn && extra) {
        let expanded = true;
        expandBtn.addEventListener('click', () => {
          expanded = !expanded;
          extra.classList.toggle('hidden', !expanded);
          expandBtn.childNodes[0].textContent = expanded ? '收起 ' : '展开 ';
          expandBtn.querySelector('svg').classList.toggle('rotate-180', expanded);
        });
      }
    });
  </script>
</body>
</html>
