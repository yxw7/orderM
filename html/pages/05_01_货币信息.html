<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货币信息</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="货币信息"
  data-active-page="05_01_货币信息.html">

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden">
    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4">
      <form id="currency-search-form" class="relative">
        <div class="absolute top-0 right-0 flex items-center gap-2">
          <button type="submit"
            class="px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">检索</button>
          <button type="button" onclick="Common.resetForm('currency-search-form')"
            class="px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">重置</button>
        </div>
        <div class="grid grid-cols-3 gap-4 pr-40">
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">货币名称</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">货币代码</label>
            <input type="text" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">货币状态</label>
            <select class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
              <option>全部</option>
              <option>使用中</option>
              <option>已停用</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4">
      <a href="05_01_01_新增货币.html"
        class="px-4 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">新增货币信息</a>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200">
      <div class="overflow-x-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap w-14">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">货币名称</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">货币代码</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">货币状态</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">货币汇率</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap sticky right-0 bg-gray-50">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100" id="currency-table-body"></tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200">
        <span class="text-sm text-gray-500">共 8 条记录</span>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-500">第 1/1 页</span>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <input type="text" value="1" readonly
            class="w-10 border border-gray-300 rounded px-2 py-1 text-sm text-center text-gray-600 bg-white">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option>50 条/页</option>
            <option>20 条/页</option>
            <option>10 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/common.js"></script>
  <script>
    /** 货币信息列表示例数据 */
    const currencyRows = [
      { name: '人民币', code: 'CNY', status: 'active', rate: '1.0000' },
      { name: '欧元', code: 'EUR', status: 'active', rate: '8.3115' },
      { name: '日元', code: 'JPY', status: 'active', rate: '0.0486' },
      { name: '英镑', code: 'GBP', status: 'active', rate: '9.0120' },
      { name: '港币', code: 'HKD', status: 'active', rate: '0.9223' },
      { name: '新台币', code: 'TWD', status: 'active', rate: '0.2223' },
      { name: '美元', code: 'USD', status: 'active', rate: '7.1000' },
      { name: '澳元', code: 'AUD', status: 'active', rate: '4.6520' }
    ];

    /**
     * 渲染货币状态
     * @param {string} status - 状态标识
     * @returns {string}
     */
    function renderCurrencyStatus(status) {
      if (status === 'active') {
        return '<span class="text-green-600">使用中</span>';
      }
      return '<span class="text-red-500">已停用</span>';
    }

    /**
     * 渲染操作列
     * @param {Object} row - 行数据
     * @returns {string}
     */
    function renderCurrencyOps(row) {
      if (row.status === 'active') {
        return `
          <a href="05_01_04_编辑货币.html" class="text-sky-600 hover:underline mr-3">编辑</a>
          <a href="05_01_03_停用_删除货币.html" class="text-sky-600 hover:underline mr-3">停用</a>
          <a href="05_01_02_汇率更新记录.html" class="text-sky-600 hover:underline">汇率更新记录</a>`;
      }
      return `
        <a href="05_01_04_编辑货币.html" class="text-sky-600 hover:underline mr-3">启用</a>
        <a href="05_01_02_汇率更新记录.html" class="text-sky-600 hover:underline mr-3">汇率更新记录</a>
        <a href="05_01_03_停用_删除货币.html" class="text-sky-600 hover:underline">删除</a>`;
    }

    /**
     * 渲染货币表格行
     * @param {Object} row - 行数据
     * @param {number} index - 行序号
     * @returns {string}
     */
    function renderCurrencyRow(row, index) {
      return `
        <tr class="hover:bg-gray-50">
          <td class="px-3 py-2 text-gray-600">${index}</td>
          <td class="px-3 py-2">${row.name}</td>
          <td class="px-3 py-2">${row.code}</td>
          <td class="px-3 py-2">${renderCurrencyStatus(row.status)}</td>
          <td class="px-3 py-2">${row.rate}</td>
          <td class="px-3 py-2 whitespace-nowrap sticky right-0 bg-white">${renderCurrencyOps(row)}</td>
        </tr>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('currency-table-body');
      if (tbody) {
        tbody.innerHTML = currencyRows.map((row, i) => renderCurrencyRow(row, i + 1)).join('');
      }
    });
  </script>
</body>
</html>
