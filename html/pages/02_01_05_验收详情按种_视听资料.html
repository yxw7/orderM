<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验收详情按种</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body[data-active-page="02_01_05_验收详情按种_视听资料.html"] .acceptance-detail-tab.active {
      color: #0284c7;
      border-bottom-color: #0284c7;
    }

    body[data-active-page="02_01_05_验收详情按种_视听资料.html"] #species-reason-tooltip {
      position: fixed;
      z-index: 60;
      max-width: 320px;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden"
  data-page-title="验收详情"
  data-active-page="02_01_05_验收详情按种_视听资料.html">

  <div id="app-root" class="flex flex-col h-full"></div>

  <div id="main-content" class="hidden flex flex-col h-full overflow-hidden p-4">
    <!-- 面包屑 -->
    <div id="acceptance-detail-breadcrumb" class="flex items-center gap-2 mb-4 text-sm shrink-0">
      <a href="02_01_验收单管理.html" id="acceptance-detail-breadcrumb-back"
        class="flex items-center gap-1 text-gray-500 hover:text-sky-600">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        验收单管理
      </a>
      <span class="text-gray-400">/</span>
      <span class="text-gray-800">验收详情</span>
      <span id="acceptance-detail-breadcrumb-id" class="text-gray-800 font-medium"></span>
    </div>

    <!-- 验收单基本信息 -->
    <div class="bg-white rounded border border-gray-200 px-5 py-3 mb-4 shrink-0">
      <div class="grid grid-cols-5 gap-x-4 gap-y-2 text-sm text-gray-700">
        <span>验收单号：<span id="acceptance-detail-id" class="text-gray-900">—</span></span>
        <span>验收单名称：<span id="acceptance-detail-name" class="text-gray-900">—</span></span>
        <span>资源类型：<span id="acceptance-detail-type" class="text-gray-900">—</span></span>
        <span>语种：<span id="acceptance-detail-lang" class="text-gray-900">—</span></span>
        <span>发货单号：<span id="acceptance-detail-shipno" class="text-gray-900">—</span></span>
        <span>供应商：<span id="acceptance-detail-supplier" class="text-gray-900">—</span></span>
        <span class="col-span-5">验收备注：<span id="acceptance-detail-remark" class="text-gray-900">—</span></span>
        <span>总种数：<span id="acceptance-detail-total-species" class="text-gray-900">—</span></span>
        <span>总册数：<span id="acceptance-detail-total-volumes" class="text-gray-900">—</span></span>
        <span>总码洋：<span id="acceptance-detail-total-list-price" class="text-gray-900">—</span></span>
        <span>总实洋：<span id="acceptance-detail-total-net-price" class="text-gray-900">—</span></span>
      </div>
    </div>

    <!-- 按种 / 按册 页签 -->
    <div class="flex gap-8 border-b border-gray-200 mb-4 shrink-0 bg-white px-1">
      <button type="button"
        class="acceptance-detail-tab active px-1 py-2.5 text-sm text-gray-600 border-b-2 border-transparent">
        按种
      </button>
      <button type="button" id="acceptance-detail-tab-volume"
        class="acceptance-detail-tab px-1 py-2.5 text-sm text-gray-600 border-b-2 border-transparent hover:text-sky-600 transition-colors">
        按册
      </button>
    </div>

    <!-- 检索区 -->
    <div class="bg-white rounded border border-gray-200 p-4 mb-4 shrink-0">
      <form id="acceptance-detail-search-form">
        <div class="grid grid-cols-4 gap-4 items-center">
          <div class="flex items-center gap-2 col-span-1">
            <select id="acceptance-detail-search-field" name="searchField"
              class="border border-gray-300 rounded px-3 py-1.5 text-sm text-gray-700 focus:outline-none focus:border-sky-500 w-28 shrink-0">
            </select>
            <input type="text" name="keyword" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-16 text-right">验收人</label>
            <input type="text" name="inspector" placeholder="请输入"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2">
            <label class="text-sm text-gray-600 whitespace-nowrap w-20 text-right">验收时间</label>
            <input type="date" name="startDate" placeholder="开始日期"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            <span class="text-gray-400 text-sm">—</span>
            <input type="date" name="endDate" placeholder="结束日期"
              class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
          </div>
          <div class="flex items-center gap-2 justify-end">
            <button type="submit"
              class="flex items-center gap-1.5 px-5 py-1.5 bg-sky-600 text-white text-sm rounded hover:bg-sky-700">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              检索
            </button>
            <button type="button" id="acceptance-detail-search-reset"
              class="flex items-center gap-1.5 px-5 py-1.5 border border-gray-300 text-gray-600 text-sm rounded hover:bg-gray-50">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
              重置
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- 操作按钮 -->
    <div class="flex items-center gap-2 mb-4 shrink-0">
      <div class="relative">
        <button type="button" data-dropdown
          class="flex items-center gap-1.5 px-4 py-1.5 text-sm rounded bg-teal-600 text-white hover:bg-teal-700">
          导出验收明细
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div data-dropdown-menu
          class="hidden absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded shadow-lg z-20 min-w-[140px] py-1">
          <button type="button" id="acceptance-species-export-detail"
            class="w-full flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 text-left">
            <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            导出明细
          </button>
          <div class="border-t border-gray-100"></div>
          <button type="button" id="acceptance-species-export-config"
            class="w-full flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 text-left">
            <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            导出配置
          </button>
        </div>
      </div>
    </div>

    <!-- 数据表格 -->
    <div class="bg-white rounded border border-gray-200 flex flex-col flex-1 min-h-0 overflow-hidden">
      <div class="flex-1 overflow-auto table-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
            <tr>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">序号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">订单行号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">ISBN/ISRC</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">载体</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">题名</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">商品条码</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">目录号</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">作者</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">定价</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">币种</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">套内件数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">发/收/损/退套数</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">
                <span class="inline-flex items-center gap-1">最近一次验收时间
                  <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                  </svg>
                </span>
              </th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">最近一次验收人</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">换/退/撤销收货原因</th>
              <th class="px-3 py-2.5 text-left text-gray-600 font-medium whitespace-nowrap">操作</th>
            </tr>
          </thead>
          <tbody id="acceptance-detail-table-body" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200 shrink-0 bg-white">
        <span id="acceptance-detail-total" class="text-sm text-gray-500">共 0 条</span>
        <div class="flex items-center gap-2">
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-400" disabled>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button type="button" class="px-3 py-1 bg-sky-600 text-white rounded text-sm">1</button>
          <button type="button" class="px-2 py-1 border border-gray-300 rounded text-sm text-gray-600 hover:bg-gray-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <select class="border border-gray-300 rounded px-2 py-1 text-sm text-gray-600">
            <option selected>10 条/页</option>
            <option>20 条/页</option>
            <option>50 条/页</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 导出配置弹窗 -->
  <div id="acceptance-species-export-config-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">导出配置</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <div class="flex flex-1 min-h-0 overflow-hidden">
        <aside class="w-28 shrink-0 border-r border-gray-200 bg-gray-50 py-4">
          <button type="button"
            class="w-full text-left px-4 py-2 text-sm text-sky-600 font-medium border-l-2 border-sky-600 bg-white">
            视听资料
          </button>
        </aside>
        <div class="flex-1 overflow-y-auto px-6 py-5">
          <label class="inline-flex items-center gap-2 cursor-pointer select-none text-sm text-gray-700 mb-4">
            <input type="checkbox" checked class="rounded text-sky-600" id="acceptance-species-export-select-all">
            全选
          </label>
          <div class="grid grid-cols-6 gap-x-4 gap-y-3 text-sm text-gray-700 mb-5">
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">验收单号</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">验收单名称</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">资源类型</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">语种</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">供应商</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">发货单号</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">总码洋</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">总实洋</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">折扣率</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">总种数</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">总册数</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">创建人</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">创建时间</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">验收备注</label>
          </div>
          <div class="border-t border-gray-200 mb-5"></div>
          <div class="grid grid-cols-6 gap-x-4 gap-y-3 text-sm text-gray-700">
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">订单行号</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">ISBN</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">题名</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">载体</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">作者</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">出版社</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">出版年</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">分类号</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">正文语种</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">丛编</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">单件码洋</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">币种</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">实洋</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">套内件数</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">发订套数</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">收货套数</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">换货套数</label>
            <label class="inline-flex items-center gap-2 cursor-pointer"><input type="checkbox" checked class="rounded text-sky-600 acceptance-species-export-field">退货套数</label>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="acceptance-species-export-config-save"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">确定</button>
      </div>
    </div>
  </div>

  <!-- 撤销收货弹窗 -->
  <div id="species-revoke-receive-modal" data-modal
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md flex flex-col"
      onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
        <h2 class="text-base font-medium text-gray-800">撤销收货</h2>
        <button type="button" data-modal-close
          class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>
      <form id="species-revoke-receive-form" class="px-6 py-5">
        <div class="flex items-center gap-3">
          <label class="text-sm text-gray-600 w-28 text-right shrink-0">
            <span class="text-red-500">*</span> 撤销收货原因
          </label>
          <select name="reason" id="species-revoke-receive-reason"
            class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm text-gray-700 focus:outline-none focus:border-sky-500">
            <option value="">请选择</option>
          </select>
        </div>
      </form>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-lg shrink-0">
        <button type="button" data-modal-close
          class="px-5 py-1.5 text-sm rounded border border-gray-300 text-gray-600 hover:bg-gray-50">取消</button>
        <button type="button" id="species-revoke-receive-submit"
          class="px-5 py-1.5 text-sm rounded bg-sky-600 text-white hover:bg-sky-700">确定</button>
      </div>
    </div>
  </div>

  <div id="species-reason-tooltip" class="hidden" role="tooltip"></div>

  <script src="../js/config.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/tab-manager.js"></script>
  <script src="../js/reason-params-store.js"></script>
  <script src="../js/acceptance-detail.js"></script>
  <script src="../js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      AcceptanceDetail.initAv();
    });
  </script>
</body>
</html>
